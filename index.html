<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="时笺">
<meta name="theme-color" content="#1a1520">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>时笺</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ─── CSS Variables ─── */
:root {
  --panel-bg: rgba(18,14,30,0.92);
  --dropdown-bg: rgba(22,16,38,0.97);
  --accent: 160, 130, 200;
  --accent-hex: #a082c8;
  --accent-soft: rgba(160,130,200,0.18);
  --accent-border: rgba(160,130,200,0.38);
  --glass: rgba(255,255,255,0.09);
  --glass-strong: rgba(255,255,255,0.15);
  --glass-hover: rgba(255,255,255,0.18);
  --border: rgba(255,255,255,0.14);
  --border-soft: rgba(255,255,255,0.07);
  --text-primary: rgba(255,255,255,0.92);
  --text-secondary: rgba(255,255,255,0.56);
  --text-tertiary: rgba(255,255,255,0.30);
  --blur: blur(18px) saturate(140%);
  --blur-heavy: blur(32px) saturate(160%);
  --radius: 14px;
  --radius-sm: 8px;
  --radius-xs: 5px;
  --font-serif: 'Noto Serif SC', serif;
  --font-sans: 'Noto Sans SC', sans-serif;
}

/* ─── Reset ─── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;font-family:var(--font-sans);overflow:hidden;background:transparent}

/* ─── Background ─── */
#bg-layer{position:fixed;top:0;left:0;right:0;bottom:0;z-index:0;background-size:cover;background-position:center;transition:all 0.6s ease;
  /* Extend into safe areas / notch / home indicator */
  top: calc(-1 * env(safe-area-inset-top, 0px));
  bottom: calc(-1 * env(safe-area-inset-bottom, 0px));
  left: calc(-1 * env(safe-area-inset-left, 0px));
  right: calc(-1 * env(safe-area-inset-right, 0px));
}
#bg-layer::after{content:'';position:absolute;inset:0;background:rgba(8,6,18,0.48);transition:background 0.6s ease}
#bg-layer[data-light]::after{background:rgba(255,255,255,0.10)}

/* Lock app height to initial screen height (defeats iOS keyboard viewport resize) */
#app { --locked-h: 100vh; top: 0 !important; height: var(--locked-h) !important; }
/* ─── App Shell ─── */
#app{position:fixed;z-index:1;left:0;right:0;display:flex;flex-direction:column;overflow:hidden}

/* ─── Topbar ─── */
.topbar{display:flex;align-items:center;padding:0 18px;height:46px;background:var(--glass-strong);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-bottom:1px solid var(--border);flex-shrink:0;gap:4px}
.topbar-left{display:flex;align-items:center;gap:0;flex:1}
.app-logo{font-family:var(--font-serif);font-size:13px;font-weight:400;color:var(--text-tertiary);letter-spacing:0.08em;padding-right:16px;margin-right:8px}
.tab{display:flex;align-items:center;gap:5px;padding:0 14px;height:46px;font-size:12.5px;font-weight:400;font-family:var(--font-sans);color:var(--text-tertiary);background:transparent;border:none;border-bottom:2px solid transparent;cursor:pointer;transition:all 0.18s;letter-spacing:0.02em}
.tab:hover{color:var(--text-secondary)}
.tab.active{color:var(--text-primary);border-bottom-color:var(--accent-hex)}
.topbar-right{display:flex;align-items:center;gap:6px}

/* ─── Icon Button ─── */
.icon-btn{width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:transparent;border:1px solid var(--border);border-radius:50%;cursor:pointer;color:var(--text-secondary);transition:all 0.15s;flex-shrink:0}
.icon-btn:hover{color:var(--text-primary);background:var(--glass-hover)}
.icon-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ─── Main ─── */
.main-area{flex:1;overflow:hidden;display:flex}
.pane{display:none;flex:1;overflow:hidden;min-width:0}
.pane.active{display:flex}

/* ─── Glass Inputs & Buttons ─── */
.glass-input{width:100%;font-size:12px;font-family:var(--font-sans);padding:7px 10px;border-radius:var(--radius-xs);border:1px solid var(--border);background:rgba(255,255,255,0.07);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:var(--text-primary);outline:none;transition:all 0.15s}
.glass-input::placeholder{color:var(--text-tertiary)}
.glass-input:focus{border-color:var(--accent-border);background:rgba(255,255,255,0.11)}
.glass-input option{background:var(--dropdown-bg);color:var(--text-primary)}
.glass-btn{display:flex;align-items:center;justify-content:center;gap:5px;padding:7px 12px;font-size:12px;font-family:var(--font-sans);border:1px solid var(--border);border-radius:var(--radius-xs);background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);color:var(--text-secondary);cursor:pointer;transition:all 0.15s;letter-spacing:0.02em;white-space:nowrap}
.glass-btn:hover{color:var(--text-primary);background:var(--glass-hover);border-color:rgba(255,255,255,0.26)}
.glass-btn.primary{background:var(--accent-soft);border-color:var(--accent-border);color:rgba(var(--accent),0.95)}
.glass-btn.primary:hover{background:rgba(var(--accent),0.28)}
.glass-btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.glass-btn.icon-only{width:28px;height:28px;padding:0;border-radius:50%}

/* ─── Sidebar label ─── */
.sidebar-label{font-size:10px;font-weight:500;color:var(--text-tertiary);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:7px}
.divider{height:1px;background:var(--border-soft);margin:4px 0}
.empty-msg{font-size:11px;color:var(--text-tertiary);text-align:center;padding:12px 0;font-style:italic}

/* ═══════════════════════════════════════
   CALENDAR
═══════════════════════════════════════ */
.cal-layout{display:flex;flex:1;overflow:hidden}
.cal-main{flex:1;padding:20px 22px;overflow-y:auto}
.cal-sidebar{width:228px;flex-shrink:0;padding:16px 14px;background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-left:1px solid var(--border);overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.cal-title{font-family:var(--font-serif);font-size:15px;font-weight:400;color:var(--text-primary);letter-spacing:0.04em}
.nav-btn{width:28px;height:28px;display:flex;align-items:center;justify-content:center;background:var(--glass);border:1px solid var(--border);border-radius:50%;cursor:pointer;color:var(--text-secondary);transition:all 0.15s}
.nav-btn:hover{color:var(--text-primary);background:var(--glass-hover)}
.nav-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:0}
.day-name{text-align:center;font-size:10px;color:var(--text-tertiary);padding:6px 0;font-weight:500;letter-spacing:0.08em;border-bottom:1px solid var(--border-soft)}
.day-cell{min-height:64px;border-radius:0;border:none;border-bottom:1px solid var(--border-soft);padding:6px 8px;cursor:pointer;background:transparent;transition:all 0.13s;position:relative;overflow:hidden}
.day-cell:hover{background:rgba(255,255,255,0.05)}
.day-cell.other-month{opacity:0.22}
.day-cell.today{background:var(--accent-soft)}
.day-cell.selected{background:rgba(var(--accent),0.28);outline:1.5px solid var(--accent-border)}
.day-cell.today.selected{background:rgba(var(--accent),0.35);outline:1.5px solid var(--accent-border)}
.day-num{font-size:11px;font-weight:400;color:var(--text-secondary);margin-bottom:3px;font-family:var(--font-serif)}
.day-cell.today .day-num{color:var(--accent-hex);font-weight:600}
.event-dot{font-size:9.5px;padding:1px 5px;border-radius:20px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:3px}
.milestone-flag{position:absolute;top:3px;right:4px;font-size:9px;opacity:0.7}

/* ─ Sidebar event items ─ */
.selected-date-display{font-family:var(--font-serif);font-size:14.5px;font-weight:400;color:var(--text-primary);letter-spacing:0.03em}
.event-item{padding:8px 10px;border-radius:var(--radius-sm);margin-bottom:5px;border-left:2px solid;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);position:relative}
.event-item-title{font-size:12px;font-weight:500}
.event-item-time{font-size:10.5px;margin-top:1px;opacity:0.65}
.event-item-cat{font-size:10px;margin-top:3px;opacity:0.75;display:flex;align-items:center;gap:4px}
.event-item-del{position:absolute;top:6px;right:6px;width:18px;height:18px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.08);border:none;border-radius:50%;cursor:pointer;opacity:0;transition:opacity 0.15s;color:var(--text-secondary)}
.event-item:hover .event-item-del{opacity:1}
.event-item-del:hover{background:rgba(255,80,80,0.2);color:#ff8080}
.event-item-del svg{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.add-form{display:flex;flex-direction:column;gap:6px}

/* ═══════════════════════════════════════
   TIMELINE
═══════════════════════════════════════ */
.tl-layout{display:flex;flex-direction:column;flex:1;padding:22px 30px;overflow:hidden}
.tl-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:10px}
.tl-heading{font-family:var(--font-serif);font-size:15px;font-weight:400;color:var(--text-primary);letter-spacing:0.04em}
.cat-filter-bar{display:flex;gap:5px;align-items:center;flex-wrap:nowrap;overflow-x:scroll;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.cat-filter-label{font-size:11px;color:var(--text-tertiary);margin-right:2px}
.cat-filter-btn{padding:4px 11px;border-radius:20px;border:1px solid var(--border);background:rgba(255,255,255,0.05);font-size:11.5px;font-family:var(--font-sans);cursor:pointer;color:var(--text-secondary);transition:0.15s;display:flex;align-items:center;gap:5px}
.cat-filter-btn:hover{color:var(--text-primary);background:var(--glass-hover)}
.cat-filter-btn.active{color:#fff}
.cat-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.tl-scroll{flex:1;overflow-y:auto}
.tl-empty{height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--text-tertiary);text-align:center;padding:0 30px;box-sizing:border-box;width:100%;overflow:hidden}
.tl-empty svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:1.5;opacity:0.35}
.tl-empty p{font-size:12.5px;font-style:italic;white-space:normal;word-break:break-all;max-width:100%;text-align:center}
.timeline{position:relative;padding-left:28px}
.tl-line{position:absolute;left:8px;top:8px;bottom:8px;width:1px;background:linear-gradient(to bottom,transparent,var(--border) 12%,var(--border) 88%,transparent)}
.tl-item{display:flex;align-items:flex-start;position:relative;margin-bottom:28px}
.tl-node{width:16px;height:16px;border-radius:50%;border:2px solid;flex-shrink:0;margin-right:16px;margin-top:2px;position:relative;z-index:1;background:rgba(15,10,28,0.75);backdrop-filter:blur(4px);transition:transform 0.15s}
.tl-item:hover .tl-node{transform:scale(1.2)}
.tl-content{padding:10px 14px;background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--border);border-radius:var(--radius-sm);flex:1;transition:all 0.15s}
.tl-item:hover .tl-content{background:var(--glass-hover);border-color:rgba(255,255,255,0.2)}
.tl-date{font-size:10.5px;color:var(--text-tertiary);margin-bottom:3px;letter-spacing:0.03em}
.tl-title{font-size:13.5px;font-weight:500;color:var(--text-primary)}
.tl-meta{font-size:11px;color:var(--text-secondary);margin-top:2px;display:flex;align-items:center;gap:5px}
.tl-today-marker{display:flex;align-items:center;gap:10px;margin-bottom:26px;position:relative}
.tl-today-line{position:absolute;left:0;right:0;height:1px;background:linear-gradient(to right,var(--accent-border),transparent);top:50%;transform:translateY(-50%);z-index:0}
.tl-today-node{width:12px;height:12px;border-radius:50%;background:var(--accent-hex);flex-shrink:0;margin-right:22px;position:relative;z-index:1}
.tl-today-label{font-size:11px;color:var(--accent-hex);font-weight:500;letter-spacing:0.04em;position:relative;z-index:1}
.past-node{opacity:0.42}

/* ═══════════════════════════════════════
   DIARY  (desktop base)
═══════════════════════════════════════ */
.diary-layout{display:flex;flex:1;overflow:hidden}
.diary-list{width:198px;flex-shrink:0;padding:12px 9px;background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-right:1px solid var(--border);overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.diary-entry-row{display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:var(--radius-sm);cursor:pointer;border:1px solid transparent;transition:background 0.25s ease;position:relative;overflow:hidden}
.diary-entry-row:hover{background:transparent}
.diary-entry-row.active{background:transparent;border-color:transparent}
/* tap flash: briefly darkens then fades out */
.diary-entry-row.tapping{background:rgba(0,0,0,0.18);transition:background 0s}
.entry-text{flex:1;min-width:0}
.entry-date{font-size:11px;font-weight:500;color:var(--text-primary)}
.entry-title-row{display:flex;align-items:center;gap:4px;margin-top:2px}
.entry-mood-icon{font-size:13px;line-height:1;flex-shrink:0;opacity:0.9}
.entry-preview{font-size:10px;color:var(--text-tertiary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-style:italic}
/* Delete btn: hidden by default on desktop (hover shows), always visible on mobile */
.entry-del-btn{flex-shrink:0;width:24px;height:24px;display:flex;align-items:center;justify-content:center;background:transparent;border:none;border-radius:50%;cursor:pointer;color:var(--text-tertiary);opacity:0;transition:opacity 0.15s,background 0.15s}
.entry-del-btn:hover{background:rgba(200,80,80,0.18);color:rgba(240,140,140,0.9)}
.diary-entry-row:hover .entry-del-btn{opacity:1}
.diary-editor{flex:1;display:flex;flex-direction:column;padding:20px 26px;overflow-y:auto}
/* Mobile-specific elements hidden on desktop */
.diary-editor-topbar{display:none}
/* On desktop the footer is just a normal block at bottom of diary-editor */
#editor-footer-mobile{display:flex;}
.diary-list-toolbar{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.diary-list-toolbar .top-row{display:flex;align-items:center;gap:6px}
.editor-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px}
.editor-date{font-family:var(--font-serif);font-size:15px;font-weight:400;color:var(--text-primary);letter-spacing:0.04em}
.editor-date-desktop{font-family:var(--font-serif);font-size:15px;font-weight:400;color:var(--text-primary);letter-spacing:0.04em}
.editor-mood,.editor-mood-desktop{display:flex;gap:2px;align-items:center}
.mood-btn{font-size:16px;padding:3px 5px;background:transparent;border:none;border-radius:6px;cursor:pointer;opacity:0.35;transition:0.12s;line-height:1}
.mood-btn:hover{opacity:0.75;transform:scale(1.12)}
.mood-btn.active{opacity:1;transform:scale(1.15)}
.tag-wrap{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px;min-height:20px}
.tag{font-size:10px;padding:2px 8px;border-radius:20px;background:var(--accent-soft);border:0.5px solid var(--accent-border);color:rgba(var(--accent),0.9);cursor:pointer;letter-spacing:0.03em;transition:0.12s}
.tag:hover{background:rgba(var(--accent),0.28)}
.diary-title-input{width:100%;font-size:15.5px;font-weight:400;font-family:var(--font-serif);border:none;background:transparent;color:var(--text-primary);outline:none;border-bottom:1px solid var(--border-soft);padding-bottom:10px;margin-bottom:13px;letter-spacing:0.03em;transition:border-color 0.15s;-webkit-tap-highlight-color:transparent;-webkit-user-select:text;user-select:text}
.diary-title-input::placeholder{color:var(--text-tertiary);font-style:italic}
.diary-title-input:focus{border-color:var(--border)}
.diary-body-input{flex:1;width:100%;font-size:13px;line-height:1.9;font-family:var(--font-sans);border:none;background:transparent;color:var(--text-secondary);resize:none;outline:none;min-height:260px;letter-spacing:0.02em;-webkit-tap-highlight-color:transparent;-webkit-user-select:text;user-select:text}
.diary-body-input::placeholder{color:var(--text-tertiary);font-style:italic}
.editor-footer{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding-top:11px;border-top:1px solid var(--border-soft)}
.char-count{font-size:10.5px;color:var(--text-tertiary)}
.save-toast{position:fixed;bottom:22px;right:22px;background:rgba(80,170,130,0.22);color:rgba(130,220,180,0.95);border:1px solid rgba(80,170,130,0.4);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);font-size:11.5px;padding:7px 14px;border-radius:20px;opacity:0;transition:opacity 0.3s;pointer-events:none;z-index:200;display:flex;align-items:center;gap:5px}
.save-toast.show{opacity:1}
.save-toast svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ═══════════════════════════════════════
   SETTINGS PANEL
═══════════════════════════════════════ */
.settings-overlay{display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,0.42);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);align-items:center;justify-content:center}
.settings-overlay.open{display:flex}
.settings-panel{background:var(--panel-bg);backdrop-filter:var(--blur-heavy);-webkit-backdrop-filter:var(--blur-heavy);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 24px 64px rgba(0,0,0,0.55);width:500px;max-width:95vw;max-height:88vh;overflow-y:auto;padding:26px;animation:panelIn 0.22s ease}
@keyframes panelIn{from{opacity:0;transform:translateY(-10px) scale(0.97)}to{opacity:1;transform:none}}
.settings-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.settings-title{font-family:var(--font-serif);font-size:15px;font-weight:400;color:var(--text-primary);letter-spacing:0.05em}
.close-btn{width:28px;height:28px;display:flex;align-items:center;justify-content:center;background:transparent;border:1px solid var(--border);border-radius:50%;cursor:pointer;color:var(--text-secondary);transition:all 0.15s}
.close-btn:hover{color:var(--text-primary);background:var(--glass-hover)}
.close-btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.settings-section{margin-bottom:22px}
.settings-section-title{font-size:10px;font-weight:500;color:var(--text-tertiary);letter-spacing:0.12em;text-transform:uppercase;margin-bottom:11px}
.bg-presets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bg-preset{aspect-ratio:16/9;border-radius:var(--radius-sm);cursor:pointer;border:2px solid transparent;transition:all 0.15s;overflow:hidden;position:relative}
.bg-preset:hover{border-color:var(--border);transform:scale(1.03)}
.bg-preset.active{border-color:var(--accent-hex)}
.bg-preset-label{position:absolute;bottom:0;left:0;right:0;font-size:9px;color:rgba(255,255,255,0.82);background:rgba(0,0,0,0.38);padding:3px 6px;text-align:center;letter-spacing:0.05em}
.accent-swatches{display:flex;gap:7px;flex-wrap:wrap}
.accent-swatch{width:30px;height:30px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all 0.15s}
.accent-swatch:hover{transform:scale(1.15)}
.accent-swatch.active{border-color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,0.3)}
.custom-upload-row{display:flex;align-items:center;gap:10px;margin-top:10px}
.custom-upload-label{font-size:11px;color:var(--text-secondary)}

/* ═══════════════════════════════════════
   CATEGORY MANAGER PANEL
═══════════════════════════════════════ */
.cat-panel{background:var(--panel-bg);backdrop-filter:var(--blur-heavy);-webkit-backdrop-filter:var(--blur-heavy);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 24px 64px rgba(0,0,0,0.55);width:440px;max-width:95vw;max-height:88vh;overflow-y:auto;padding:26px;animation:panelIn 0.22s ease}
.cat-list{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
.cat-row{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:var(--radius-sm);border:1px solid var(--border-soft);background:rgba(255,255,255,0.04);transition:all 0.13s;overflow:hidden}
.cat-row:hover{background:rgba(255,255,255,0.07);border-color:var(--border)}
.cat-row-swatch{width:14px;height:14px;border-radius:50%;flex-shrink:0;cursor:pointer}
.cat-row-name{flex:1;font-size:12.5px;color:var(--text-primary);min-width:0}
.cat-row-count{font-size:10px;color:var(--text-tertiary);flex-shrink:0;white-space:nowrap;min-width:24px;text-align:right}
.cat-row-del{width:22px;height:22px;display:flex;align-items:center;justify-content:center;background:transparent;border:none;border-radius:50%;cursor:pointer;color:var(--text-tertiary);transition:all 0.13s;flex-shrink:0}
.cat-row-del:hover{background:rgba(255,80,80,0.18);color:#ff9090}
.cat-row-del svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.new-cat-form{display:flex;gap:7px;align-items:center;padding:10px;background:rgba(255,255,255,0.04);border-radius:var(--radius-sm);border:1px solid var(--border-soft)}
.color-picker-wrap{position:relative;flex-shrink:0}
.color-preview{width:28px;height:28px;border-radius:50%;border:1px solid var(--border);cursor:pointer;transition:transform 0.13s}
.color-preview:hover{transform:scale(1.1)}
.color-picker-native{position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;cursor:pointer;border-radius:50%}

/* ─── Custom Color Popup ─── */
.color-popup{display:none;position:absolute;bottom:calc(100% + 8px);left:0;z-index:300;background:var(--dropdown-bg);border:1px solid var(--border);border-radius:var(--radius);padding:14px;box-shadow:0 12px 40px rgba(0,0,0,0.55);backdrop-filter:var(--blur-heavy);-webkit-backdrop-filter:var(--blur-heavy);width:220px;animation:panelIn 0.16s ease}
.color-popup.open{display:block}
.color-popup-presets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.color-popup-swatch{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform 0.12s,border-color 0.12s;flex-shrink:0}
.color-popup-swatch:hover{transform:scale(1.18)}
.color-popup-swatch.active{border-color:rgba(255,255,255,0.8)}
.color-popup-divider{height:1px;background:var(--border-soft);margin-bottom:11px}
.color-popup-custom{display:flex;align-items:center;gap:9px;cursor:pointer}
.color-popup-custom-ball{width:22px;height:22px;border-radius:50%;border:1.5px dashed rgba(255,255,255,0.35);flex-shrink:0;transition:transform 0.12s}
.color-popup-custom:hover .color-popup-custom-ball{transform:scale(1.12)}
.color-popup-custom-label{font-size:11px;color:var(--text-secondary);font-family:var(--font-sans)}

/* ─── Desktop only ─── */
.desktop-only { display: flex; }
/* Diary rail: on desktop, just a normal flex row (no sliding) */
.diary-rail { display: contents; }
/* Diary mobile-only elements hidden on desktop */
.diary-editor-topbar { display: none; }
/* Diary toolbar visible on both, slightly different desktop style */
.diary-list-toolbar { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
.diary-list-toolbar .top-row { display: flex; align-items: center; gap: 6px; }
.diary-list-toolbar .glass-btn { flex: 1; }

/* ═══════════════════════════════════════
   MOBILE RESPONSIVE  (≤ 600px)
═══════════════════════════════════════ */
@media (max-width: 600px) {
  .desktop-only { display: none !important; }

  /* Topbar: logo hidden, tabs shrink to fit, tighter */
  .topbar { padding: 0 8px; height: 46px; gap: 0; overflow: hidden; }
  .app-logo { display: none; }
  .topbar-left { flex: 1; min-width: 0; overflow: hidden; }
  .tab { padding: 0 8px; height: 46px; font-size: 11px; gap: 3px; flex-shrink: 1; white-space: nowrap; }
  .tab svg { display: block; flex-shrink: 0; }
  .topbar-right { flex-shrink: 0; gap: 4px; }
  .icon-btn { width: 30px; height: 30px; flex-shrink: 0; }

  /* ── Calendar: full scroll layout ── */
  .cal-layout { flex-direction: column; overflow: hidden; position: relative; }
  /* Hide the old static cal-main header/grid – replaced by scroll container */
  .cal-main { display: none; }
  .cal-sidebar {
    width: 100%; border-left: none; border-top: none;
    padding: 0; flex-shrink: 0; max-height: none; overflow-y: visible;
    background: transparent; backdrop-filter: none; -webkit-backdrop-filter: none;
  }

  /* Scrollable months container */
  #mobile-cal-scroll {
    display: flex; flex-direction: column; flex: 1; overflow-y: auto;
    -webkit-overflow-scrolling: touch; padding-bottom: 120px;
  }

  .mobile-month-block { padding: 14px 10px 10px; flex-shrink: 0; }
  .mobile-month-block .cal-header { margin-bottom: 10px; }
  .mobile-month-block .cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 0; }

  /* Floating edit button */
  #mobile-add-btn {
    position: fixed; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); left: 50%;
    transform: translateX(-50%); z-index: 80;
    background: var(--accent-hex); color: #fff;
    border: none; border-radius: 30px; padding: 13px 28px;
    font-size: 14px; font-family: var(--font-sans); font-weight: 500;
    box-shadow: 0 4px 20px rgba(0,0,0,0.28);
    cursor: pointer; display: flex; align-items: center; gap: 8px;
    transition: opacity 0.22s, transform 0.22s;
    white-space: nowrap;
  }
  #mobile-add-btn.hidden { opacity: 0; pointer-events: none; transform: translateX(-50%) translateY(12px); }
  #mobile-add-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; }

  /* Add event modal (mobile) */
  #mobile-add-modal {
    display: none; position: fixed; inset: 0; z-index: 150;
    background: rgba(0,0,0,0.45); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    align-items: flex-end;
  }
  #mobile-add-modal.open { display: flex; }
  #mobile-add-modal-inner {
    width: 100%; background: var(--panel-bg); border-radius: var(--radius) var(--radius) 0 0;
    padding: 20px 18px calc(20px + env(safe-area-inset-bottom, 0px));
    animation: panelIn 0.22s ease;
  }
  #mobile-add-modal-inner .modal-title {
    font-family: var(--font-serif); font-size: 15px; color: var(--text-primary);
    margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center;
  }
  #mobile-add-modal-inner .add-form { gap: 10px; }

  .day-cell { min-height: 44px; padding: 3px 4px; }
  .event-dot { font-size: 8.5px; padding: 0 3px; }
  .day-num { font-size: 10px; }
  .cal-header { margin-bottom: 10px; }

  /* ── Timeline ── */
  .tl-layout { padding: 14px 12px; overflow: hidden; display: flex; flex-direction: column; }
  .tl-header { margin-bottom: 14px; flex-direction: column; align-items: flex-start; gap: 8px; width: 100%; flex-shrink: 0; }
  .cat-filter-bar { flex-wrap: wrap; overflow: visible; width: 100%; row-gap: 6px; column-gap: 5px; }
  .cat-filter-label { width: 100%; margin-bottom: 0; }
  .cat-filter-btn { font-size: 11px; padding: 4px 10px; white-space: nowrap; flex-shrink: 0; }
  .tl-scroll { flex: 1; overflow-y: auto; min-height: 0; }
  .tl-empty { min-height: 200px; height: 100%; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 10px; padding: 0 20px; box-sizing: border-box; text-align: center; }
  .tl-empty p { white-space: normal; word-break: break-word; font-size: 12px; max-width: 100%; }
  .tl-content { padding: 8px 10px; }
  .tl-title { font-size: 12.5px; }

  /* ── Diary: 200% rail — no background bleed ever ── */
  .diary-layout {
    position: relative;
    overflow: hidden;
    flex: 1;
    min-width: 0;        /* prevent flex children from overflowing parent */
    max-width: 100%;     /* hard cap at screen width */
    display: block;      /* block so the rail inside can be 200% of THIS box */
  }

  /* Inner rail wrapper that does the sliding */
  .diary-rail {
    display: flex;
    width: 200%;
    height: 100%;
    transition: transform 0.28s cubic-bezier(0.4,0,0.2,1);
    will-change: transform;
  }

  /* LIST VIEW — left half of the rail = exactly 1 screen wide */
  .diary-list {
    width: 50%;
    flex-shrink: 0;
    border-right: none;
    flex-direction: column;
    gap: 4px;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 14px 12px 24px;
    position: relative;
    box-sizing: border-box;
  }

  /* EDITOR VIEW — right half of the rail = exactly 1 screen wide */
  .diary-editor {
    width: 50%;
    flex-shrink: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
    box-sizing: border-box;
    /* height is inherited from rail which fills the fixed #app — no resize from keyboard */
  }

  /* Slide: shift the rail left by 50% (= 1 screen width) */
  .diary-layout.editor-open .diary-rail { transform: translateX(-50%); }

  /* ── Mobile editor topbar (back + date + mood) ── */
  .diary-editor-topbar {
    display: flex;
    align-items: center;
    gap: 10px;
    height: 50px;
    padding: 0 14px;
    flex-shrink: 0;
    border-bottom: 1px solid var(--border);
    background: var(--glass);
    backdrop-filter: var(--blur);
    -webkit-backdrop-filter: var(--blur);
    isolation: isolate;
    will-change: transform;
  }
  .diary-back-btn {
    display: flex; align-items: center; gap: 4px;
    background: transparent; border: none;
    color: var(--accent-hex);
    font-size: 13px; font-family: var(--font-sans);
    cursor: pointer; padding: 0; flex-shrink: 0;
    letter-spacing: 0.02em;
  }
  .diary-back-btn svg {
    width: 14px; height: 14px; stroke: currentColor;
    fill: none; stroke-width: 2.2;
    stroke-linecap: round; stroke-linejoin: round;
  }
  .diary-editor-topbar .editor-date {
    flex: 1; font-size: 13.5px; text-align: center;
  }
  .diary-editor-topbar .editor-mood {
    flex-shrink: 0;
  }

  /* ── Scrollable editor body ── */
  .diary-editor-scroll {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 16px 14px 8px;
    display: flex;
    flex-direction: column;
  }
  /* Footer is a direct flex child of diary-editor — always at the bottom */
  #editor-footer-mobile {
    flex-shrink: 0;
    padding: 8px 14px calc(10px + env(safe-area-inset-bottom, 0px));
    border-top: 1px solid var(--border-soft);
    background: transparent;
  }
  /* Hide the desktop editor-header (date+mood row) inside scroll */
  .diary-editor-scroll .editor-header { display: none; }

  /* ── List toolbar ── */
  .diary-list-toolbar {
    display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px;
  }
  .diary-list-toolbar .top-row {
    display: flex; align-items: center; gap: 8px;
  }
  .diary-list-toolbar .top-row .glass-btn { flex: 1; }
  /* Delete btn always visible on touch devices */
  .entry-del-btn { opacity: 0.45 !important; }
  .diary-entry-row:active .entry-del-btn { opacity: 1 !important; }

  .diary-title-input { font-size: 14px; }

  /* ── Settings / Cat panels — centered on all screen sizes ── */
  .settings-panel { width: calc(100vw - 32px); max-width: 460px; max-height: 88vh; border-radius: var(--radius); margin: 0 auto; }
  .cat-panel { width: calc(100vw - 32px); max-width: 420px; max-height: 88vh; border-radius: var(--radius); margin: 0 auto; }
  .settings-overlay.open { align-items: center; }

  /* ── Toast position ── */
  .save-toast { bottom: 80px; right: 14px; }

  /* ── Cat select dropdown opens upward already; ensure not clipped ── */
  #cat-select-wrap { position: static; }
  #cat-dropdown { position: fixed; left: 10px; right: 10px; bottom: 60px; width: auto; }
}

/* Safe area insets for iPhone notch / home indicator */
@supports (padding-bottom: env(safe-area-inset-bottom)) {
  @media (max-width: 600px) {
    .cal-sidebar, .diary-editor, .tl-layout {
      padding-bottom: calc(14px + env(safe-area-inset-bottom));
    }
    .topbar {
      padding-top: env(safe-area-inset-top);
      height: calc(46px + env(safe-area-inset-top));
    }
    /* App shell also needs to cover safe areas */
    #app {
      top: 0 !important;
      /* extend to bottom safe area */
    }
  }
}

::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.22)}
</style>
</head>
<body>
<div id="bg-layer"></div>
<div id="app">

<!-- ══ Topbar ══ -->
<div class="topbar">
  <div class="topbar-left">
    <span class="app-logo">时笺</span>
    <button class="tab active" onclick="switchTab('calendar',this)">
      <!-- calendar icon -->
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      日历
    </button>
    <button class="tab" onclick="switchTab('timeline',this)">
      <!-- timeline icon -->
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><circle cx="7" cy="12" r="2" fill="currentColor" stroke="none"/><circle cx="12" cy="7" r="2" fill="currentColor" stroke="none"/><circle cx="17" cy="12" r="2" fill="currentColor" stroke="none"/><circle cx="12" cy="17" r="2" fill="currentColor" stroke="none"/></svg>
      时间轴
    </button>
    <button class="tab" onclick="switchTab('diary',this)">
      <!-- notebook icon -->
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      简记
    </button>
  </div>
  <div class="topbar-right">
    <!-- categories manage -->
    <button class="icon-btn" onclick="toggleCatPanel()" title="管理事件类别">
      <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
    </button>
    <!-- settings -->
    <button class="icon-btn" onclick="toggleSettings()" title="设置">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
    <!-- fullscreen (hidden on mobile) -->
    <button class="icon-btn desktop-only" id="fs-btn" onclick="toggleFullscreen()" title="全屏">
      <svg id="fs-icon-enter" viewBox="0 0 24 24"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
      <svg id="fs-icon-exit" viewBox="0 0 24 24" style="display:none"><polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="10" y1="14" x2="3" y2="21"/><line x1="21" y1="3" x2="14" y2="10"/></svg>
    </button>
  </div>
</div>

<!-- ══ Main Area ══ -->
<div class="main-area">

<!-- ── Calendar Pane ── -->
<div id="pane-calendar" class="pane active">
  <div class="cal-layout">
    <div class="cal-main">
      <div class="cal-header">
        <button class="nav-btn" onclick="prevMonth()">
          <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <span class="cal-title" id="cal-title"></span>
        <button class="nav-btn" onclick="nextMonth()">
          <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>
      <div class="cal-grid" id="cal-grid">
        <div class="day-name">日</div><div class="day-name">一</div><div class="day-name">二</div>
        <div class="day-name">三</div><div class="day-name">四</div><div class="day-name">五</div><div class="day-name">六</div>
      </div>
    </div>
    <!-- Mobile vertical scroll months (shown only on mobile via JS) -->
    <div id="mobile-cal-scroll"></div>
    <div class="cal-sidebar">
      <div class="selected-date-display" id="sidebar-date"></div>
      <div class="sidebar-label">日程</div>
      <div id="sidebar-events"></div>
      <div class="divider"></div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
        <button onclick="toggleAddForm()" id="add-form-toggle-btn" style="background:transparent;border:none;color:var(--text-tertiary);font-size:11px;font-family:var(--font-sans);cursor:pointer;padding:0;display:flex;align-items:center;gap:4px;letter-spacing:0.02em">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          添加日程
        </button>
        <div style="position:relative">
          <button onclick="toggleCalMenu(event)" style="background:transparent;border:none;color:var(--text-tertiary);cursor:pointer;font-size:16px;line-height:1;padding:0 2px" title="更多">···</button>
          <div id="cal-menu" style="display:none;position:absolute;right:0;bottom:calc(100% + 4px);background:var(--dropdown-bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px 0;z-index:50;min-width:110px;box-shadow:0 8px 32px rgba(0,0,0,0.4)">
            <button onclick="exportCalendar();document.getElementById('cal-menu').style.display='none'" style="display:flex;align-items:center;gap:7px;width:100%;padding:7px 14px;background:transparent;border:none;color:var(--text-secondary);font-size:12px;font-family:var(--font-sans);cursor:pointer" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='var(--text-secondary)'">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              导出日历
            </button>
            <button onclick="document.getElementById('cal-import-input').click();document.getElementById('cal-menu').style.display='none'" style="display:flex;align-items:center;gap:7px;width:100%;padding:7px 14px;background:transparent;border:none;color:var(--text-secondary);font-size:12px;font-family:var(--font-sans);cursor:pointer" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='var(--text-secondary)'">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
              导入日历
            </button>
          </div>
          <input type="file" id="cal-import-input" accept=".json" style="display:none" onchange="importCalendar(event)">
        </div>
      </div>
      <div class="add-form" id="add-form-panel" style="display:none">
        <input class="glass-input" id="ev-title" placeholder="事件名称" />
        <input class="glass-input" id="ev-time" placeholder="时间（如 09:00）" />
        <div style="position:relative" id="cat-select-wrap">
          <div id="cat-select-display" onclick="toggleCatDropdown()" style="display:flex;align-items:center;gap:8px;width:100%;font-size:12px;font-family:var(--font-sans);padding:7px 10px;border-radius:var(--radius-xs);border:1px solid var(--border);background:rgba(255,255,255,0.07);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:var(--text-primary);cursor:pointer;transition:all 0.15s;user-select:none" onmouseover="this.style.background='rgba(255,255,255,0.11)'" onmouseout="this.style.background='rgba(255,255,255,0.07)'">
            <span id="cat-select-ball" style="width:10px;height:10px;border-radius:50%;background:#c86450;flex-shrink:0;display:inline-block;box-shadow:0 0 5px currentColor"></span>
            <span id="cat-select-label" style="flex:1">一级 — 最重大</span>

<script>
// ═══════════════════════════════════════════════════
//  本地存储 (localStorage persistence)
// ═══════════════════════════════════════════════════
const STORAGE_KEY = 'shijian_v1';

let _appReady = false;

function saveAll() {
  if (!_appReady) return;
  try {
    const data = {
      events,
      entries,
      builtinCats: BUILTIN_CATS,
      customCats,
      theme: { bg: currentBg, accent: currentAccent },
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch(e) { /* quota exceeded or private mode */ }
}

function loadAll() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch(e) { return null; }
}

// ═══════════════════════════════════════════════════
//  Category System
// ═══════════════════════════════════════════════════
// Each category: { id, name, color, builtin }
// color is hex string

let BUILTIN_CATS = [
  { id:'p1', name:'一级 — 最重大', color:'#c86450', builtin:true },
  { id:'p2', name:'二级 — 重要',   color:'#8c78d2', builtin:true },
  { id:'p3', name:'三级 — 一般',   color:'#50aa82', builtin:true },
  { id:'p4', name:'四级 — 次要',   color:'#be9632', builtin:true },
  { id:'p5', name:'五级 — 备注',   color:'#508cc8', builtin:true },
];

let customCats = []; // user-created categories
function allCats() { return [...BUILTIN_CATS, ...customCats]; }
function catById(id) { return allCats().find(c=>c.id===id) || (allCats()[0]||{id:'',name:'未知',color:'#888'}); }

function hexToRgba(hex, a) {
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

function addCategory() {
  const name = document.getElementById('new-cat-name').value.trim();
  const color = document.getElementById('new-cat-color').value;
  if(!name) return;
  const id = 'c_' + Date.now();
  customCats.push({ id, name, color, builtin:false });
  document.getElementById('new-cat-name').value = '';
  renderCatList();
  refreshCatSelects();
  saveAll();
}

function deleteCategory(id) {
  BUILTIN_CATS = BUILTIN_CATS.filter(c=>c.id!==id);
  customCats = customCats.filter(c=>c.id!==id);
  // re-assign events of this category to first available cat or remove
  const first = allCats()[0];
  Object.values(events).forEach(evArr => {
    evArr.forEach(ev => { if(ev.catId===id) ev.catId = first ? first.id : ''; });
  });
  renderCatList();
  refreshCatSelects();
  renderCalendar();
  if(document.getElementById('pane-timeline').classList.contains('active')) renderTimeline();
  saveAll();
}

function updateCategoryName(id, newName) {
  if(!newName.trim()) return;
  const cat = allCats().find(c=>c.id===id);
  if(!cat) return;
  cat.name = newName.trim();
  // sync all rendered views
  refreshCatSelects();
  renderCalendar();
  if(document.getElementById('pane-timeline').classList.contains('active')) renderTimeline();
  saveAll();
}

function updateCategoryColor(id, newColor) {
  const cat = allCats().find(c=>c.id===id);
  if(!cat) return;
  cat.color = newColor;
  refreshCatSelects();
  renderCalendar();
  if(document.getElementById('pane-timeline').classList.contains('active')) renderTimeline();
  saveAll();
}

function renderCatList() {
  const el = document.getElementById('cat-list');
  const cats = allCats();
  const counts = {};
  Object.values(events).forEach(arr => arr.forEach(ev => {
    counts[ev.catId] = (counts[ev.catId]||0)+1;
  }));
  el.innerHTML = cats.map(c => `
    <div class="cat-row" id="catrow-${c.id}">
      <div class="color-picker-wrap" style="flex-shrink:0">

        <input type="color" class="color-picker-native" value="${c.color}" style="position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;cursor:pointer;border-radius:50%"
          oninput="document.getElementById('swatch-${c.id}').style.background=this.value"
          onchange="updateCategoryColor('${c.id}',this.value);renderCatList()">
      </div>
      <input class="cat-row-name-input" value="${c.name.replace(/&/g,'&amp;').replace(/"/g,'&quot;')}" 
        style="flex:1;min-width:0;font-size:12.5px;color:var(--text-primary);background:transparent;border:none;border-bottom:1px solid transparent;outline:none;font-family:var(--font-sans);padding:1px 4px;cursor:text;transition:border-color 0.15s;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"
        onfocus="this.style.borderBottomColor='var(--border)'"
        onblur="this.style.borderBottomColor='transparent';updateCategoryName('${c.id}',this.value)"
        onkeydown="if(event.key==='Enter'){this.blur()}"
        title="点击修改名称">

      <button class="cat-row-del" data-del-id="${c.id}" title="删除类别">

      </button>
    </div>`).join('');

  // Attach delete listeners after render (avoids HTML-escaping issues in onclick)
  el.querySelectorAll('.cat-row-del[data-del-id]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.getAttribute('data-del-id');
      confirmDeleteCat(id);
    });
  });
}

function confirmDeleteCat(id) {
  const cats = allCats();
  if(cats.length <= 1) {
    showCatConfirm('至少需要保留一个事件类别。', null);
    return;
  }
  const cat = cats.find(c=>c.id===id);
  if(!cat) return;
  const count = Object.values(events).reduce((s,arr)=>s+arr.filter(e=>e.catId===id).length,0);
  const msg = count > 0
    ? `删除「${cat.name}」？\n该类别下 ${count} 个事件将归入第一个类别。`
    : `删除「${cat.name}」？`;
  showCatConfirm(msg, () => deleteCategory(id));
}

function showCatConfirm(msg, onConfirm, okLabel, okDanger) {
  const overlay = document.getElementById('del-confirm-overlay');
  document.getElementById('del-confirm-msg').textContent = msg;
  overlay.style.display = 'flex';
  document.getElementById('del-confirm-ok').onclick = () => {
    overlay.style.display = 'none';
    if(onConfirm) onConfirm();
  };
  document.getElementById('del-confirm-cancel').onclick = () => {
    overlay.style.display = 'none';
  };
  document.getElementById('del-confirm-cancel').style.display = onConfirm ? '' : 'none';
  const okBtn = document.getElementById('del-confirm-ok');
  okBtn.textContent = onConfirm ? (okLabel || '确认删除') : '好';
  if(okDanger === false) {
    okBtn.style.background = 'var(--glass)';
    okBtn.style.borderColor = 'var(--border)';
    okBtn.style.color = 'var(--text-primary)';
  } else {
    okBtn.style.background = 'rgba(200,80,80,0.18)';
    okBtn.style.borderColor = 'rgba(200,80,80,0.38)';
    okBtn.style.color = 'rgba(240,140,140,0.95)';
  }
}

function applyBg(preset, isCustom) {
  const bg = document.getElementById('bg-layer');
  const isLight = !isCustom && preset.light;
  if(isCustom) {
    bg.style.backgroundImage = `url(${preset.url})`;
    bg.style.backgroundSize = 'cover';
  } else {
    bg.style.backgroundImage = preset.css;
  }
  // Switch overlay and text colors based on light/dark
  const overlay = bg.querySelector ? bg : document.getElementById('bg-layer');
  const r = document.documentElement;
  if(isLight) {
    r.style.setProperty('--text-primary',  'rgba(30,25,40,0.92)');
    r.style.setProperty('--text-secondary','rgba(30,25,40,0.62)');
    r.style.setProperty('--text-tertiary', 'rgba(30,25,40,0.36)');
    r.style.setProperty('--glass',         'rgba(255,255,255,0.48)');
    r.style.setProperty('--glass-strong',  'rgba(255,255,255,0.65)');
    r.style.setProperty('--glass-hover',   'rgba(255,255,255,0.72)');
    r.style.setProperty('--border',        'rgba(30,25,40,0.14)');
    r.style.setProperty('--border-soft',   'rgba(30,25,40,0.08)');
    r.style.setProperty('--panel-bg',      'rgba(245,242,250,0.96)');
    r.style.setProperty('--dropdown-bg',   'rgba(240,237,248,0.98)');
    document.getElementById('bg-layer').style.setProperty('--overlay','rgba(255,255,255,0.12)');
    document.querySelector('#bg-layer').setAttribute('data-light','1');
  } else {
    r.style.setProperty('--text-primary',  'rgba(255,255,255,0.92)');
    r.style.setProperty('--text-secondary','rgba(255,255,255,0.56)');
    r.style.setProperty('--text-tertiary', 'rgba(255,255,255,0.30)');
    r.style.setProperty('--glass',         'rgba(255,255,255,0.09)');
    r.style.setProperty('--glass-strong',  'rgba(255,255,255,0.15)');
    r.style.setProperty('--glass-hover',   'rgba(255,255,255,0.18)');
    r.style.setProperty('--border',        'rgba(255,255,255,0.14)');
    r.style.setProperty('--border-soft',   'rgba(255,255,255,0.07)');
    r.style.setProperty('--panel-bg',      'rgba(18,14,30,0.92)');
    r.style.setProperty('--dropdown-bg',   'rgba(22,16,38,0.97)');
    document.querySelector('#bg-layer').removeAttribute('data-light');
  }
  document.querySelectorAll('.bg-preset').forEach(el=>el.classList.remove('active'));
  const el = document.querySelector(`[data-bg-id="${preset.id}"]`);
  if(el) el.classList.add('active');
  currentBg = preset.id;

  // ── 同步状态栏颜色（PWA 刘海区与导航栏保持一致）──
  const tc = preset.themeColor || (isCustom ? '#0e0e14' : (isLight ? '#e8f4fd' : '#0e0e14'));
  let metaTheme = document.querySelector('meta[name="theme-color"]');
  if (!metaTheme) {
    metaTheme = document.createElement('meta');
    metaTheme.name = 'theme-color';
    document.head.appendChild(metaTheme);
  }
  metaTheme.setAttribute('content', tc);

  saveAll();
}

const today = new Date();
let curYear=today.getFullYear(), curMonth=today.getMonth();
let selectedDate=new Date(today);

// Sort events array by time (earlier first, '全天' last) — returns new array
function sortedEvs(evArr) {
  return [...evArr].sort((a, b) => {
    const ta = a.time && a.time !== '全天' ? a.time : '99:99';
    const tb = b.time && b.time !== '全天' ? b.time : '99:99';
    return ta.localeCompare(tb);
  });
}

function fmtKey(d){return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function fmtIso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function parseDate(str){const[y,m,d]=str.split('-').map(Number);return new Date(y,m-1,d)}
function fmtNice(str){const d=parseDate(str);return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日'}

// events: { 'YYYY-M-D': [{title,time,catId},...] }
let events = {};

// ── Tab switching ──
function switchTab(t,btn){
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.pane').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('pane-'+t).classList.add('active');
  if(t==='calendar'){
    // Jump back to today's month whenever entering calendar from another tab
    curYear=today.getFullYear(); curMonth=today.getMonth();
    selectedDate=new Date(today);
    renderCalendar();
    // Mobile: scroll to today's month block
    if(isMobileView()){
      setTimeout(()=>{
        const todayBlock=document.querySelector('#mobile-cal-scroll [data-month-today="1"]');
        if(todayBlock) todayBlock.scrollIntoView({behavior:'smooth',block:'start'});
      },80);
    }
  }
  if(t==='timeline'){renderCatFilterBar();renderTimeline();}
  if(t==='diary'){renderEntryList();if(entries.length>0&&activeIdx<0){activeIdx=0;loadEntry(0);}}
  if(t!=='calendar'){const addBtn=document.getElementById('mobile-add-btn');if(addBtn)addBtn.classList.add('hidden');}
}

// ── Calendar ──
function renderCalendar(){
  const months=['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
  document.getElementById('cal-title').textContent=curYear+'年 '+months[curMonth];
  const grid=document.getElementById('cal-grid');
  grid.querySelectorAll('.day-cell').forEach(c=>c.remove());
  const first=new Date(curYear,curMonth,1).getDay();
  const daysInMonth=new Date(curYear,curMonth+1,0).getDate();
  const daysInPrev=new Date(curYear,curMonth,0).getDate();
  let dayCount=1,nextDay=1;
  for(let i=0;i<42;i++){
    const cell=document.createElement('div');cell.className='day-cell';
    let d,isOther=false;
    if(i<first){d=daysInPrev-(first-1-i);isOther=true;cell.classList.add('other-month');}
    else if(dayCount>daysInMonth){d=nextDay++;isOther=true;cell.classList.add('other-month');}
    else d=dayCount++;
    const cellDate=isOther?(i<first?new Date(curYear,curMonth-1,d):new Date(curYear,curMonth+1,d)):new Date(curYear,curMonth,d);
    if(!isOther&&cellDate.toDateString()===today.toDateString())cell.classList.add('today');
    if(cellDate.toDateString()===selectedDate.toDateString())cell.classList.add('selected');
    const num=document.createElement('div');num.className='day-num';num.textContent=d;cell.appendChild(num);
    const key=fmtKey(cellDate);
    if(events[key]){
      const hasP1=events[key].some(e=>e.catId==='p1');
      if(hasP1){const f=document.createElement('span');f.className='milestone-flag';f.textContent='🚩';cell.appendChild(f);}
      sortedEvs(events[key]).slice(0,2).forEach(ev=>{
        const cat=catById(ev.catId);
        const dot=document.createElement('div');
        dot.className='event-dot';
        dot.style.background=hexToRgba(cat.color,0.18);
        dot.style.border=`0.5px solid ${hexToRgba(cat.color,0.45)}`;
        dot.style.color=cat.color;
        // small color circle + title
        dot.innerHTML=`<span style="width:6px;height:6px;border-radius:50%;background:${cat.color};flex-shrink:0;display:inline-block"></span>${ev.title}`;
        cell.appendChild(dot);
      });
    }
    cell.onclick=()=>{selectedDate=cellDate;renderCalendar();renderSidebar();};
    grid.appendChild(cell);
  }
  renderSidebar();
}

function renderSidebar(){
  document.getElementById('sidebar-date').textContent=selectedDate.getFullYear()+'年'+(selectedDate.getMonth()+1)+'月'+selectedDate.getDate()+'日';
  const key=fmtKey(selectedDate);
  const evs=sortedEvs(events[key]||[]);
  const c=document.getElementById('sidebar-events');
  if(!evs.length){c.innerHTML='<div class="empty-msg">暂无日程</div>';return;}
  const origEvs=events[key]||[];
  c.innerHTML=evs.map((ev)=>{
    const origIdx=origEvs.indexOf(ev);
    const cat=catById(ev.catId);

// ── Timeline ──
function renderTimeline(){
  const body=document.getElementById('tl-body');
  const cats=activeCatFilter==='all'?allCats().map(c=>c.id):[activeCatFilter];
  let items=[];
  Object.entries(events).forEach(([key,evArr])=>{
    evArr.filter(e=>cats.includes(e.catId)).forEach(ev=>{
      const[y,m,d]=key.split('-').map(Number);
      items.push({date:new Date(y,m-1,d),key,ev});
    });
  });
  // Sort by date, then by time within same day
  items.sort((a,b)=>{
    const dateDiff = a.date - b.date;
    if (dateDiff !== 0) return dateDiff;
    // Same date: sort by time string (HH:MM). '全天' goes last.
    const ta = a.ev.time && a.ev.time !== '全天' ? a.ev.time : '99:99';
    const tb = b.ev.time && b.ev.time !== '全天' ? b.ev.time : '99:99';
    return ta.localeCompare(tb);
  });
  if(!items.length){
    body.innerHTML=`<div class="tl-empty">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="9" y1="16" x2="15" y2="16"/></svg>
      <p>该类别暂无时间节点</p>
      <p style="font-size:10.5px;margin-top:2px;opacity:0.65">在日历中添加对应类别的事件后显示</p>
    </div>`;
    return;
  }
  const todayMs=new Date(today.getFullYear(),today.getMonth(),today.getDate()).getTime();
  const pastItems=items.filter(x=>x.date.getTime()<todayMs);
  const futureItems=items.filter(x=>x.date.getTime()>=todayMs);
  let html=`<div class="timeline"><div class="tl-line"></div>`;
  const tlItem=(x,cls,diffStr)=>{const cat=catById(x.ev.catId);return`<div class="tl-item ${cls}"><div class="tl-node" style="border-color:${cat.color};box-shadow:0 0 0 3px ${hexToRgba(cat.color,0.18)},0 0 8px ${hexToRgba(cat.color,0.15)}"></div><div class="tl-content"><div class="tl-date">${fmtNice(x.key)} · ${diffStr}</div><div class="tl-title">${x.ev.title}</div><div class="tl-meta"><span style="width:7px;height:7px;border-radius:50%;background:${cat.color};display:inline-block;flex-shrink:0"></span>${cat.name}${x.ev.time&&x.ev.time!=='全天'?' · '+x.ev.time:''}</div></div></div>`;};
  pastItems.forEach(x=>{const diff=Math.round((todayMs-x.date.getTime())/86400000);html+=tlItem(x,'past-node',diff===0?'今天':diff+'天前');});
  html+=`<div class="tl-today-marker"><div class="tl-today-line"></div><div class="tl-today-node"></div><div class="tl-today-label">今天 · ${today.getFullYear()}年${today.getMonth()+1}月${today.getDate()}日</div></div>`;
  futureItems.forEach(x=>{const diff=Math.round((x.date.getTime()-todayMs)/86400000);html+=tlItem(x,'',diff===0?'今天':diff+'天后');});
  html+=`</div>`;
  body.innerHTML=html;
}

function importDiary(event){
  const file=event.target.files[0];
  if(!file)return;
  const input=event.target;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const json=JSON.parse(e.target.result);
      if(json.type!=='diary'||!Array.isArray(json.data))throw new Error('格式错误');
      const count=json.data.length;
      showCatConfirm(`导入 ${count} 条简记？`,()=>{
        const existIds=new Set(entries.map(x=>x.id));
        json.data.forEach(item=>{
          const newItem={...item};
          if(existIds.has(newItem.id)){newItem.id=Date.now()+Math.random();}
          entries.push(newItem);
          existIds.add(newItem.id);
        });
        entries.sort((a,b)=>b.id-a.id);
        renderEntryList();
        saveAll();
        alert(`导入完成，新增 ${count} 条简记`);
      }, '确认导入', false);
    }catch(err){alert('导入失败：'+err.message);}
    try{input.value='';}catch(_){}
  };
  reader.readAsText(file);
}

function importCalendar(evt){
  const file=evt.target.files[0];
  if(!file)return;
  const input=evt.target;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const json=JSON.parse(e.target.result);
      if(json.type!=='calendar'||typeof json.events!=='object'||Array.isArray(json.events))throw new Error('格式错误');
      const totalCount=Object.values(json.events).reduce((s,arr)=>s+(Array.isArray(arr)?arr.length:0),0);
      showCatConfirm(`导入 ${totalCount} 个日历事件？\n将与现有事件合并（按日期+标题去重）。`,()=>{
        if(Array.isArray(json.builtinCats)){
          json.builtinCats.forEach(c=>{
            const existing=BUILTIN_CATS.find(b=>b.id===c.id);
            if(existing){existing.name=c.name;existing.color=c.color;}
          });
        }
        if(Array.isArray(json.customCats)){
          const existIds=new Set(customCats.map(c=>c.id));
          json.customCats.forEach(c=>{if(!existIds.has(c.id))customCats.push(c);});
        }
        let added=0;
        Object.entries(json.events).forEach(([key,arr])=>{
          if(!Array.isArray(arr))return;
          if(!events[key])events[key]=[];
          const existTitles=new Set(events[key].map(ev=>ev.title));
          arr.forEach(ev=>{
            if(!existTitles.has(ev.title)){events[key].push(ev);added++;existTitles.add(ev.title);}
          });
        });
        refreshCatSelects();
        renderCalendar();
        renderTimeline();
        saveAll();
        alert(`导入完成，新增 ${added} 个事件`);
      }, '确认导入', false);
    }catch(err){alert('导入失败：'+err.message);}
    try{input.value='';}catch(_){}
  };
  reader.readAsText(file);
}

//  Mobile Calendar — Vertical Scrollable Months
// ═══════════════════════════════════════════════════
const MONTHS_CN = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];

// Whether we are on mobile
function isMobileView() { return window.innerWidth <= 600; }

// Track if a date has been explicitly selected by the user on mobile
let mobileSelectedDate = null; // null = no selection

function renderMobileCalendar(preserveScroll) {
  if (!isMobileView()) return;
  const container = document.getElementById('mobile-cal-scroll');
  // Save scroll position before re-render
  const savedScrollTop = preserveScroll ? container.scrollTop : null;
  container.innerHTML = '';

  // Render 12 months: 3 past + current + 8 future
  const now = new Date();
  const startOffset = -3;
  const endOffset = 60;

  for (let offset = startOffset; offset <= endOffset; offset++) {
    let y = now.getFullYear(), m = now.getMonth() + offset;
    while (m < 0) { m += 12; y--; }
    while (m > 11) { m -= 12; y++; }
    container.appendChild(buildMobileMonthBlock(y, m));
  }

  if (savedScrollTop !== null) {
    // Restore scroll position immediately (no jump)
    container.scrollTop = savedScrollTop;
  } else {
    // First load only: scroll today's month into view
    const todayBlock = container.querySelector('[data-month-today="1"]');
    if (todayBlock) {
      setTimeout(() => { todayBlock.scrollIntoView({behavior:'instant',block:'start'}); }, 50);
    }
  }
}

function buildMobileMonthBlock(year, month) {
  const wrap = document.createElement('div');
  wrap.className = 'mobile-month-block';
  const isCurrentMonth = year === today.getFullYear() && month === today.getMonth();
  if (isCurrentMonth) wrap.setAttribute('data-month-today','1');

  // Header
  const header = document.createElement('div');
  header.className = 'cal-header';
  header.innerHTML = `<span class="cal-title">${year}年 ${MONTHS_CN[month]}</span>`;
  wrap.appendChild(header);

  // Day name row
  const grid = document.createElement('div');
  grid.className = 'cal-grid';
  ['日','一','二','三','四','五','六'].forEach(n => {
    const d = document.createElement('div');
    d.className = 'day-name'; d.textContent = n;
    grid.appendChild(d);
  });

  const first = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const daysInPrev = new Date(year, month, 0).getDate();
  let dayCount = 1, nextDay = 1;

  for (let i = 0; i < 42; i++) {
    const cell = document.createElement('div');
    cell.className = 'day-cell';
    let d, isOther = false;
    if (i < first) { d = daysInPrev - (first-1-i); isOther = true; cell.classList.add('other-month'); }
    else if (dayCount > daysInMonth) { d = nextDay++; isOther = true; cell.classList.add('other-month'); }
    else d = dayCount++;

    const cellDate = isOther
      ? (i < first ? new Date(year, month-1, d) : new Date(year, month+1, d))
      : new Date(year, month, d);

    if (!isOther && cellDate.toDateString() === today.toDateString()) cell.classList.add('today');
    if (mobileSelectedDate && cellDate.toDateString() === mobileSelectedDate.toDateString()) cell.classList.add('selected');

    const num = document.createElement('div');
    num.className = 'day-num'; num.textContent = d;
    cell.appendChild(num);

    const key = fmtKey(cellDate);
    if (events[key]) {
      const hasP1 = events[key].some(e => e.catId === 'p1');
      if (hasP1) { const f = document.createElement('span'); f.className = 'milestone-flag'; f.textContent = '🚩'; cell.appendChild(f); }
      sortedEvs(events[key]).slice(0,2).forEach(ev => {
        const cat = catById(ev.catId);
        const dot = document.createElement('div');
        dot.className = 'event-dot';
        dot.style.background = hexToRgba(cat.color, 0.18);
        dot.style.border = `0.5px solid ${hexToRgba(cat.color,0.45)}`;
        dot.style.color = cat.color;
        dot.innerHTML = `<span style="width:6px;height:6px;border-radius:50%;background:${cat.color};flex-shrink:0;display:inline-block"></span>${ev.title}`;
        cell.appendChild(dot);
      });
    }

    cell.addEventListener('click', () => {
      mobileSelectedDate = cellDate;
      // Re-render to update selected highlighting (preserve scroll position)
      renderMobileCalendar(true);
      // Show add button
      updateMobileAddBtn();
    });

    grid.appendChild(cell);
  }
  wrap.appendChild(grid);

  return wrap;
}

        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>`;
  }).join('');
}

function deleteMobEventInModal(key, idx) {
  events[key].splice(idx, 1);
  if (!events[key].length) delete events[key];
  renderMobEventsList();
  renderMobileCalendar(true);
  saveAll();
}

function closeMobileAddModal() {
  document.getElementById('mobile-add-modal').style.display = 'none';
}

function handleMobileModalOverlay(e) {
  if (e.target === document.getElementById('mobile-add-modal')) closeMobileAddModal();
}

function refreshMobCatSelect() {
  const cats = allCats();
  const currentId = document.getElementById('mob-ev-cat-select')?.value;
  const valid = cats.find(c => c.id === currentId);
  if (!valid && cats.length > 0) selectMobCat(cats[0].id);
  else if (valid) {
    document.getElementById('mob-cat-select-ball').style.background = valid.color;
    document.getElementById('mob-cat-select-label').textContent = valid.name;
  }
}

function selectMobCat(id) {
  const cat = catById(id);
  document.getElementById('mob-ev-cat-select').value = id;
  document.getElementById('mob-cat-select-ball').style.background = cat.color;
  document.getElementById('mob-cat-select-label').textContent = cat.name;
  closeMobCatDropdown();
}

// Fixed-position dropdown (renders outside modal to avoid clipping)
function toggleMobCatDropdown(e) {
  e.stopPropagation();
  const existing = document.getElementById('mob-cat-dropdown-fixed');
  if (existing) { closeMobCatDropdown(); return; }

  const trigger = document.getElementById('mob-cat-select-display');
  const rect = trigger.getBoundingClientRect();
  const cats = allCats();

  const dd = document.createElement('div');
  dd.id = 'mob-cat-dropdown-fixed';
  dd.style.cssText = `position:fixed;z-index:9999;background:var(--dropdown-bg);border:1px solid var(--border);border-radius:8px;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,0.55);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);`;
  
  // Populate items
  dd.innerHTML = cats.map(c => `
    <div onclick="selectMobCat('${c.id}')" style="display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer;transition:background 0.12s;font-size:13px;font-family:var(--font-sans);color:var(--text-primary)"
      onmouseover="this.style.background='rgba(255,255,255,0.09)'" onmouseout="this.style.background='transparent'">
      <span style="width:10px;height:10px;border-radius:50%;background:${c.color};flex-shrink:0;display:inline-block"></span>
      <span>${c.name}</span>
    </div>`).join('');

  document.body.appendChild(dd);

  // Position: try below trigger, flip above if not enough space
  const ddHeight = Math.min(cats.length * 41, 220);
  dd.style.maxHeight = ddHeight + 'px';
  const spaceBelow = window.innerHeight - rect.bottom - 8;
  const spaceAbove = rect.top - 8;
  const width = rect.width;
  dd.style.width = width + 'px';
  dd.style.left = rect.left + 'px';
  if (spaceBelow >= ddHeight || spaceBelow >= spaceAbove) {
    dd.style.top = (rect.bottom + 4) + 'px';
  } else {
    dd.style.bottom = (window.innerHeight - rect.top + 4) + 'px';
  }

  // Close on outside click
  setTimeout(() => {
    document.addEventListener('click', closeMobCatDropdownOnce);
  }, 0);
}

function closeMobCatDropdownOnce(e) {
  const dd = document.getElementById('mob-cat-dropdown-fixed');
  if (dd && !dd.contains(e.target)) {
    closeMobCatDropdown();
  }
}

function closeMobCatDropdown() {
  const dd = document.getElementById('mob-cat-dropdown-fixed');
  if (dd) dd.remove();
  document.removeEventListener('click', closeMobCatDropdownOnce);
}

function addEventMobile() {
  if (!mobileSelectedDate) return;
  const t = document.getElementById('mob-ev-title').value.trim();
  const ti = document.getElementById('mob-ev-time').value || '全天';
  const catId = document.getElementById('mob-ev-cat-select').value;
  if (!t) return;
  const key = fmtKey(mobileSelectedDate);
  if (!events[key]) events[key] = [];
  events[key].push({title:t, time:ti, catId});
  document.getElementById('mob-ev-title').value = '';
  clearMobTime();
  // Refresh events list in modal (keep modal open)
  renderMobEventsList();
  renderMobileCalendar(true);
  renderCalendar();
  saveAll();
}

// Initialize mobile calendar on load + resize
function initMobileCalendarIfNeeded() {
  const scroll = document.getElementById('mobile-cal-scroll');
  const calMain = document.querySelector('.cal-main');
  const calSidebar = document.querySelector('.cal-sidebar');
  if (isMobileView()) {
    scroll.style.display = 'flex';
    if (calMain) calMain.style.display = 'none';
    if (calSidebar) calSidebar.style.display = 'none';
    renderMobileCalendar();
  } else {
    scroll.style.display = 'none';
    if (calMain) calMain.style.display = '';
    if (calSidebar) calSidebar.style.display = '';
  }
}

// Patch addEvent/deleteEventSidebar to also refresh mobile calendar
const _origAddEvent = addEvent;
addEvent = function() { _origAddEvent(); if(isMobileView()) renderMobileCalendar(true); };
const _origDeleteEventSidebar = deleteEventSidebar;
deleteEventSidebar = function(key, idx) { _origDeleteEventSidebar(key, idx); if(isMobileView()) renderMobileCalendar(true); };

window.addEventListener('resize', () => {
  initMobileCalendarIfNeeded();
  updateMobileAddBtn();
});

// Init after app is ready
setTimeout(initMobileCalendarIfNeeded, 0);

// ═══════════════════════════════════════════════════
//  Time Picker (scroll wheel)
// ═══════════════════════════════════════════════════
const ITEM_H = 40; // px per wheel item

function buildWheel(el, count, fmt) {
  el.innerHTML = '';
  // Top padding: pushes item[0] down so it can be centered in the 200px window
  // Window = 200px, center = 100px from top, item height = 40px
  // For item[0] to center: its top edge must be at 100 - 40/2 = 80px → pad = 80px
  const PAD = 80; // px  (= container_height/2 - ITEM_H/2 = 100 - 20)
  const topPad = document.createElement('div');
  topPad.style.cssText = `height:${PAD}px;scroll-snap-align:none;flex-shrink:0;pointer-events:none`;
  el.appendChild(topPad);
  for (let i = 0; i < count; i++) {
    const item = document.createElement('div');
    item.style.cssText = `height:${ITEM_H}px;line-height:${ITEM_H}px;scroll-snap-align:center;font-size:20px;font-family:var(--font-sans);color:var(--text-primary);cursor:pointer;user-select:none`;
    item.textContent = fmt(i);
    item.dataset.val = i;
    el.appendChild(item);
  }
  // Bottom padding mirrors top so last item can also center
  const botPad = document.createElement('div');
  botPad.style.cssText = `height:${PAD}px;scroll-snap-align:none;flex-shrink:0;pointer-events:none`;
  el.appendChild(botPad);
  // Remove scrollbar
  el.style.cssText += ';scrollbar-width:none';
}

function wheelScrollTo(el, idx, animated) {
  // PAD = 80px before first item; each item is ITEM_H=40px; to center item[idx]:
  // scrollTop = PAD + idx * ITEM_H - (containerH/2 - ITEM_H/2) = 80 + idx*40 - 80 = idx*40
  el.scrollTo({ top: idx * ITEM_H, behavior: animated ? 'smooth' : 'instant' });
}

function wheelGetIdx(el) {
  // scrollTop = idx * ITEM_H  →  idx = round(scrollTop / ITEM_H)
  return Math.max(0, Math.round(el.scrollTop / ITEM_H));
}

function openTimePicker() {
  const overlay = document.getElementById('time-picker-overlay');
  const hw = document.getElementById('tp-hour-wheel');
  const mw = document.getElementById('tp-min-wheel');
  buildWheel(hw, 24, h => String(h).padStart(2,'0'));
  buildWheel(mw, 60, m => String(m).padStart(2,'0'));

  // Set initial value from existing selection
  const cur = document.getElementById('mob-ev-time').value;
  let initH = 9, initM = 0;
  if (cur && cur !== '全天') {
    const parts = cur.split(':');
    initH = parseInt(parts[0]) || 9;
    initM = parseInt(parts[1]) || 0;
  }
  // Use requestAnimationFrame to ensure DOM is ready before scrolling
  overlay.style.display = 'flex';
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      wheelScrollTo(hw, initH, false);
      wheelScrollTo(mw, initM, false);
    });
  });
}

function cancelTimePicker() {
  document.getElementById('time-picker-overlay').style.display = 'none';
}

function handleTimePickerOverlay(e) {
  if (e.target === document.getElementById('time-picker-overlay')) cancelTimePicker();
}

function confirmTimePicker() {
  const hw = document.getElementById('tp-hour-wheel');
  const mw = document.getElementById('tp-min-wheel');
  const h = wheelGetIdx(hw);
  const m = wheelGetIdx(mw);
  const timeStr = String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');
  document.getElementById('mob-ev-time').value = timeStr;
  document.getElementById('mob-time-label').textContent = timeStr;
  document.getElementById('mob-time-label').style.color = 'var(--text-primary)';
  document.getElementById('mob-time-clear').style.display = '';
  document.getElementById('time-picker-overlay').style.display = 'none';
}

function clearMobTime() {
  document.getElementById('mob-ev-time').value = '';
  document.getElementById('mob-time-label').textContent = '全天（点击选择时间）';
  document.getElementById('mob-time-label').style.color = 'var(--text-tertiary)';
  document.getElementById('mob-time-clear').style.display = 'none';
}

// Also reset time display when modal opens
const _origOpenMobileAddModal = openMobileAddModal;
openMobileAddModal = function() {
  _origOpenMobileAddModal();
  // Ensure time display is fresh (if value was cleared from last session)
  const val = document.getElementById('mob-ev-time').value;
  if (!val) {
    document.getElementById('mob-time-label').textContent = '全天（点击选择时间）';
    document.getElementById('mob-time-label').style.color = 'var(--text-tertiary)';
    document.getElementById('mob-time-clear').style.display = 'none';
  }
};
