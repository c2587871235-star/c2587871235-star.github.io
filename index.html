<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="时笺">
<meta name="theme-color" content="#1a1520">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>时笺</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ─── SVG Icon Helper ─── */
.ico { display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; }
.ico svg { display:block; }

/* ─── CSS Variables ─── */
:root {
  --accent: 160, 130, 200;
  --accent-hex: #a082c8;
  --accent-soft: rgba(160,130,200,0.18);
  --accent-border: rgba(160,130,200,0.38);
  --glass: rgba(255,255,255,0.09);
  --glass-strong: rgba(255,255,255,0.15);
  --glass-hover: rgba(255,255,255,0.18);
  --border: rgba(255,255,255,0.14);
  --border-soft: rgba(255,255,255,0.07);
  --text-primary: rgba(255,255,255,0.92);
  --text-secondary: rgba(255,255,255,0.56);
  --text-tertiary: rgba(255,255,255,0.30);
  --blur: blur(18px) saturate(140%);
  --blur-heavy: blur(32px) saturate(160%);
  --radius: 14px;
  --radius-sm: 8px;
  --radius-xs: 5px;
  --font-serif: 'Noto Serif SC', serif;
  --font-sans: 'Noto Sans SC', sans-serif;
}

/* ─── Reset ─── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;font-family:var(--font-sans);overflow:hidden;background:#1a1520}

/* ─── Background ─── */
#bg-layer{position:fixed;inset:0;z-index:0;background-size:cover;background-position:center;transition:all 0.6s ease}
#bg-layer::after{content:'';position:absolute;inset:0;background:rgba(8,6,18,0.48)}

/* ─── App Shell ─── */
#app{position:relative;z-index:1;width:100vw;height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* ─── Topbar ─── */
.topbar{display:flex;align-items:center;padding:0 18px;height:50px;background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-bottom:1px solid var(--border);flex-shrink:0;gap:4px}
.topbar-left{display:flex;align-items:center;gap:6px;flex:1}
.app-logo{font-family:var(--font-serif);font-size:13.5px;font-weight:400;color:var(--text-secondary);letter-spacing:0.08em;padding-right:14px;border-right:1px solid var(--border);margin-right:4px}
.tab{display:flex;align-items:center;gap:5px;padding:5px 13px;font-size:12.5px;font-weight:400;font-family:var(--font-sans);color:var(--text-secondary);background:transparent;border:1px solid transparent;border-radius:20px;cursor:pointer;transition:all 0.18s;letter-spacing:0.02em}
.tab:hover{color:var(--text-primary);background:var(--glass-hover)}
.tab.active{color:var(--text-primary);background:var(--glass-strong);border-color:var(--border);box-shadow:0 2px 12px rgba(0,0,0,0.18)}
.topbar-right{display:flex;align-items:center;gap:6px}

/* ─── Icon Button ─── */
.icon-btn{width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:transparent;border:1px solid var(--border);border-radius:50%;cursor:pointer;color:var(--text-secondary);transition:all 0.15s;flex-shrink:0}
.icon-btn:hover{color:var(--text-primary);background:var(--glass-hover)}
.icon-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ─── Main ─── */
.main-area{flex:1;overflow:hidden;display:flex}
.pane{display:none;flex:1}
.pane.active{display:flex}

/* ─── Glass Inputs & Buttons ─── */
.glass-input{width:100%;font-size:12px;font-family:var(--font-sans);padding:7px 10px;border-radius:var(--radius-xs);border:1px solid var(--border);background:rgba(255,255,255,0.07);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:var(--text-primary);outline:none;transition:all 0.15s}
.glass-input::placeholder{color:var(--text-tertiary)}
.glass-input:focus{border-color:var(--accent-border);background:rgba(255,255,255,0.11)}
.glass-input option{background:#2a2035;color:#fff}
.glass-btn{display:flex;align-items:center;justify-content:center;gap:5px;padding:7px 12px;font-size:12px;font-family:var(--font-sans);border:1px solid var(--border);border-radius:var(--radius-xs);background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);color:var(--text-secondary);cursor:pointer;transition:all 0.15s;letter-spacing:0.02em;white-space:nowrap}
.glass-btn:hover{color:var(--text-primary);background:var(--glass-hover);border-color:rgba(255,255,255,0.26)}
.glass-btn.primary{background:var(--accent-soft);border-color:var(--accent-border);color:rgba(var(--accent),0.95)}
.glass-btn.primary:hover{background:rgba(var(--accent),0.28)}
.glass-btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.glass-btn.icon-only{width:28px;height:28px;padding:0;border-radius:50%}

/* ─── Sidebar label ─── */
.sidebar-label{font-size:10px;font-weight:500;color:var(--text-tertiary);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:7px}
.divider{height:1px;background:var(--border-soft);margin:4px 0}
.empty-msg{font-size:11px;color:var(--text-tertiary);text-align:center;padding:12px 0;font-style:italic}

/* ═══════════════════════════════════════
   CALENDAR
═══════════════════════════════════════ */
.cal-layout{display:flex;flex:1;overflow:hidden}
.cal-main{flex:1;padding:20px 22px;overflow-y:auto}
.cal-sidebar{width:228px;flex-shrink:0;padding:16px 14px;background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-left:1px solid var(--border);overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.cal-title{font-family:var(--font-serif);font-size:15px;font-weight:400;color:var(--text-primary);letter-spacing:0.04em}
.nav-btn{width:28px;height:28px;display:flex;align-items:center;justify-content:center;background:var(--glass);border:1px solid var(--border);border-radius:50%;cursor:pointer;color:var(--text-secondary);transition:all 0.15s}
.nav-btn:hover{color:var(--text-primary);background:var(--glass-hover)}
.nav-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.day-name{text-align:center;font-size:10px;color:var(--text-tertiary);padding:5px 0;font-weight:500;letter-spacing:0.08em}
.day-cell{min-height:68px;border-radius:var(--radius-sm);border:1px solid var(--border-soft);padding:5px 6px;cursor:pointer;background:rgba(255,255,255,0.035);transition:all 0.13s;position:relative;overflow:hidden}
.day-cell:hover{background:rgba(255,255,255,0.08);border-color:var(--border)}
.day-cell.other-month{opacity:0.25}
.day-cell.today{border-color:var(--accent-border);background:var(--accent-soft)}
.day-cell.selected{background:rgba(255,255,255,0.10);border-color:rgba(255,255,255,0.22)}
.day-num{font-size:11px;font-weight:400;color:var(--text-secondary);margin-bottom:3px;font-family:var(--font-serif)}
.day-cell.today .day-num{color:var(--accent-hex);font-weight:500}
.event-dot{font-size:9.5px;padding:1px 5px;border-radius:20px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:3px}
.milestone-flag{position:absolute;top:3px;right:4px;font-size:9px;opacity:0.7}

/* ─ Sidebar event items ─ */
.selected-date-display{font-family:var(--font-serif);font-size:14.5px;font-weight:400;color:var(--text-primary);letter-spacing:0.03em}
.event-item{padding:8px 10px;border-radius:var(--radius-sm);margin-bottom:5px;border-left:2px solid;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);position:relative}
.event-item-title{font-size:12px;font-weight:500}
.event-item-time{font-size:10.5px;margin-top:1px;opacity:0.65}
.event-item-cat{font-size:10px;margin-top:3px;opacity:0.75;display:flex;align-items:center;gap:4px}
.event-item-del{position:absolute;top:6px;right:6px;width:18px;height:18px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.08);border:none;border-radius:50%;cursor:pointer;opacity:0;transition:opacity 0.15s;color:var(--text-secondary)}
.event-item:hover .event-item-del{opacity:1}
.event-item-del:hover{background:rgba(255,80,80,0.2);color:#ff8080}
.event-item-del svg{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.add-form{display:flex;flex-direction:column;gap:6px}

/* ═══════════════════════════════════════
   TIMELINE
═══════════════════════════════════════ */
.tl-layout{display:flex;flex-direction:column;flex:1;padding:22px 30px;overflow:hidden}
.tl-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:10px}
.tl-heading{font-family:var(--font-serif);font-size:15px;font-weight:400;color:var(--text-primary);letter-spacing:0.04em}
.cat-filter-bar{display:flex;gap:5px;align-items:center;flex-wrap:nowrap;overflow-x:scroll;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.cat-filter-label{font-size:11px;color:var(--text-tertiary);margin-right:2px}
.cat-filter-btn{padding:4px 11px;border-radius:20px;border:1px solid var(--border);background:rgba(255,255,255,0.05);font-size:11.5px;font-family:var(--font-sans);cursor:pointer;color:var(--text-secondary);transition:0.15s;display:flex;align-items:center;gap:5px}
.cat-filter-btn:hover{color:var(--text-primary);background:var(--glass-hover)}
.cat-filter-btn.active{color:#fff}
.cat-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.tl-scroll{flex:1;overflow-y:auto}
.tl-empty{height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--text-tertiary);text-align:center;padding:0 30px;box-sizing:border-box;width:100%;overflow:hidden}
.tl-empty svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:1.5;opacity:0.35}
.tl-empty p{font-size:12.5px;font-style:italic;white-space:normal;word-break:break-all;max-width:100%;text-align:center}
.timeline{position:relative;padding-left:28px}
.tl-line{position:absolute;left:8px;top:8px;bottom:8px;width:1px;background:linear-gradient(to bottom,transparent,var(--border) 12%,var(--border) 88%,transparent)}
.tl-item{display:flex;align-items:flex-start;position:relative;margin-bottom:28px}
.tl-node{width:16px;height:16px;border-radius:50%;border:2px solid;flex-shrink:0;margin-right:16px;margin-top:2px;position:relative;z-index:1;background:rgba(15,10,28,0.75);backdrop-filter:blur(4px);transition:transform 0.15s}
.tl-item:hover .tl-node{transform:scale(1.2)}
.tl-content{padding:10px 14px;background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--border);border-radius:var(--radius-sm);flex:1;transition:all 0.15s}
.tl-item:hover .tl-content{background:var(--glass-hover);border-color:rgba(255,255,255,0.2)}
.tl-date{font-size:10.5px;color:var(--text-tertiary);margin-bottom:3px;letter-spacing:0.03em}
.tl-title{font-size:13.5px;font-weight:500;color:var(--text-primary)}
.tl-meta{font-size:11px;color:var(--text-secondary);margin-top:2px;display:flex;align-items:center;gap:5px}
.tl-today-marker{display:flex;align-items:center;gap:10px;margin-bottom:26px;position:relative}
.tl-today-line{position:absolute;left:0;right:0;height:1px;background:linear-gradient(to right,var(--accent-border),transparent);top:50%;transform:translateY(-50%);z-index:0}
.tl-today-node{width:12px;height:12px;border-radius:50%;background:var(--accent-hex);flex-shrink:0;margin-right:22px;position:relative;z-index:1;box-shadow:0 0 10px var(--accent-hex)}
.tl-today-label{font-size:11px;color:var(--accent-hex);font-weight:500;letter-spacing:0.04em;position:relative;z-index:1}
.past-node{opacity:0.42}

/* ═══════════════════════════════════════
   DIARY
═══════════════════════════════════════ */
.diary-layout{display:flex;flex:1;overflow:hidden}
.diary-list{width:198px;flex-shrink:0;padding:12px 9px;background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-right:1px solid var(--border);overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.diary-entry-row{padding:8px 10px;border-radius:var(--radius-sm);cursor:pointer;border:1px solid transparent;transition:all 0.12s}
.diary-entry-row:hover{background:rgba(255,255,255,0.06);border-color:var(--border-soft)}
.diary-entry-row.active{background:var(--glass-strong);border-color:var(--border)}
.entry-date{font-size:11px;font-weight:500;color:var(--text-primary)}
.entry-preview{font-size:10px;color:var(--text-tertiary);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px;font-style:italic}
.diary-editor{flex:1;display:flex;flex-direction:column;padding:20px 26px;overflow-y:auto}
.editor-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px}
.editor-date{font-family:var(--font-serif);font-size:15px;font-weight:400;color:var(--text-primary);letter-spacing:0.04em}
.editor-mood{display:flex;gap:4px}
.mood-btn{font-size:15px;padding:3px 7px;background:transparent;border:1px solid var(--border-soft);border-radius:var(--radius-xs);cursor:pointer;opacity:0.42;transition:0.12s}
.mood-btn:hover,.mood-btn.active{opacity:1;border-color:var(--border);background:var(--glass);transform:scale(1.1)}
.tag-wrap{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px;min-height:20px}
.tag{font-size:10px;padding:2px 8px;border-radius:20px;background:var(--accent-soft);border:0.5px solid var(--accent-border);color:rgba(var(--accent),0.9);cursor:pointer;letter-spacing:0.03em;transition:0.12s}
.tag:hover{background:rgba(var(--accent),0.28)}
.diary-title-input{width:100%;font-size:15.5px;font-weight:400;font-family:var(--font-serif);border:none;background:transparent;color:var(--text-primary);outline:none;border-bottom:1px solid var(--border-soft);padding-bottom:10px;margin-bottom:13px;letter-spacing:0.03em;transition:border-color 0.15s}
.diary-title-input::placeholder{color:var(--text-tertiary);font-style:italic}
.diary-title-input:focus{border-color:var(--border)}
.diary-body-input{flex:1;width:100%;font-size:13px;line-height:1.9;font-family:var(--font-sans);border:none;background:transparent;color:var(--text-secondary);resize:none;outline:none;min-height:260px;letter-spacing:0.02em}
.diary-body-input::placeholder{color:var(--text-tertiary);font-style:italic}
.editor-footer{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding-top:11px;border-top:1px solid var(--border-soft)}
.char-count{font-size:10.5px;color:var(--text-tertiary)}
.save-toast{position:fixed;bottom:22px;right:22px;background:rgba(80,170,130,0.22);color:rgba(130,220,180,0.95);border:1px solid rgba(80,170,130,0.4);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);font-size:11.5px;padding:7px 14px;border-radius:20px;opacity:0;transition:opacity 0.3s;pointer-events:none;z-index:200;display:flex;align-items:center;gap:5px}
.save-toast.show{opacity:1}
.save-toast svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ═══════════════════════════════════════
   SETTINGS PANEL
═══════════════════════════════════════ */
.settings-overlay{display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,0.42);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);align-items:center;justify-content:center}
.settings-overlay.open{display:flex}
.settings-panel{background:rgba(18,14,30,0.88);backdrop-filter:var(--blur-heavy);-webkit-backdrop-filter:var(--blur-heavy);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 24px 64px rgba(0,0,0,0.55);width:500px;max-width:95vw;max-height:88vh;overflow-y:auto;padding:26px;animation:panelIn 0.22s ease}
@keyframes panelIn{from{opacity:0;transform:translateY(-10px) scale(0.97)}to{opacity:1;transform:none}}
.settings-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.settings-title{font-family:var(--font-serif);font-size:15px;font-weight:400;color:var(--text-primary);letter-spacing:0.05em}
.close-btn{width:28px;height:28px;display:flex;align-items:center;justify-content:center;background:transparent;border:1px solid var(--border);border-radius:50%;cursor:pointer;color:var(--text-secondary);transition:all 0.15s}
.close-btn:hover{color:var(--text-primary);background:var(--glass-hover)}
.close-btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.settings-section{margin-bottom:22px}
.settings-section-title{font-size:10px;font-weight:500;color:var(--text-tertiary);letter-spacing:0.12em;text-transform:uppercase;margin-bottom:11px}
.bg-presets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bg-preset{aspect-ratio:16/9;border-radius:var(--radius-sm);cursor:pointer;border:2px solid transparent;transition:all 0.15s;overflow:hidden;position:relative}
.bg-preset:hover{border-color:var(--border);transform:scale(1.03)}
.bg-preset.active{border-color:var(--accent-hex)}
.bg-preset-label{position:absolute;bottom:0;left:0;right:0;font-size:9px;color:rgba(255,255,255,0.82);background:rgba(0,0,0,0.38);padding:3px 6px;text-align:center;letter-spacing:0.05em}
.accent-swatches{display:flex;gap:7px;flex-wrap:wrap}
.accent-swatch{width:30px;height:30px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all 0.15s}
.accent-swatch:hover{transform:scale(1.15)}
.accent-swatch.active{border-color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,0.3)}
.custom-upload-row{display:flex;align-items:center;gap:10px;margin-top:10px}
.custom-upload-label{font-size:11px;color:var(--text-secondary)}

/* ═══════════════════════════════════════
   CATEGORY MANAGER PANEL
═══════════════════════════════════════ */
.cat-panel{background:rgba(18,14,30,0.90);backdrop-filter:var(--blur-heavy);-webkit-backdrop-filter:var(--blur-heavy);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 24px 64px rgba(0,0,0,0.55);width:440px;max-width:95vw;max-height:88vh;overflow-y:auto;padding:26px;animation:panelIn 0.22s ease}
.cat-list{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
.cat-row{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:var(--radius-sm);border:1px solid var(--border-soft);background:rgba(255,255,255,0.04);transition:all 0.13s}
.cat-row:hover{background:rgba(255,255,255,0.07);border-color:var(--border)}
.cat-row-swatch{width:14px;height:14px;border-radius:50%;flex-shrink:0;cursor:pointer}
.cat-row-name{flex:1;font-size:12.5px;color:var(--text-primary)}
.cat-row-count{font-size:10.5px;color:var(--text-tertiary);margin-right:4px}
.cat-row-del{width:22px;height:22px;display:flex;align-items:center;justify-content:center;background:transparent;border:none;border-radius:50%;cursor:pointer;color:var(--text-tertiary);transition:all 0.13s}
.cat-row-del:hover{background:rgba(255,80,80,0.18);color:#ff9090}
.cat-row-del svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.new-cat-form{display:flex;gap:7px;align-items:center;padding:10px;background:rgba(255,255,255,0.04);border-radius:var(--radius-sm);border:1px solid var(--border-soft)}
.color-picker-wrap{position:relative;flex-shrink:0}
.color-preview{width:28px;height:28px;border-radius:50%;border:1px solid var(--border);cursor:pointer;transition:transform 0.13s}
.color-preview:hover{transform:scale(1.1)}
.color-picker-native{position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;cursor:pointer;border-radius:50%}

/* ─── Custom Color Popup ─── */
.color-popup{display:none;position:absolute;bottom:calc(100% + 8px);left:0;z-index:300;background:rgba(22,16,38,0.97);border:1px solid var(--border);border-radius:var(--radius);padding:14px;box-shadow:0 12px 40px rgba(0,0,0,0.55);backdrop-filter:var(--blur-heavy);-webkit-backdrop-filter:var(--blur-heavy);width:220px;animation:panelIn 0.16s ease}
.color-popup.open{display:block}
.color-popup-presets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.color-popup-swatch{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform 0.12s,border-color 0.12s;flex-shrink:0}
.color-popup-swatch:hover{transform:scale(1.18)}
.color-popup-swatch.active{border-color:rgba(255,255,255,0.8)}
.color-popup-divider{height:1px;background:var(--border-soft);margin-bottom:11px}
.color-popup-custom{display:flex;align-items:center;gap:9px;cursor:pointer}
.color-popup-custom-ball{width:22px;height:22px;border-radius:50%;border:1.5px dashed rgba(255,255,255,0.35);flex-shrink:0;transition:transform 0.12s}
.color-popup-custom:hover .color-popup-custom-ball{transform:scale(1.12)}
.color-popup-custom-label{font-size:11px;color:var(--text-secondary);font-family:var(--font-sans)}

/* ─── Desktop only ─── */
.desktop-only { display: flex; }

/* ═══════════════════════════════════════
   MOBILE RESPONSIVE  (≤ 600px)
═══════════════════════════════════════ */
@media (max-width: 600px) {
  .desktop-only { display: none !important; }

  /* Topbar: logo hidden, tabs icon-only, tighter */
  .topbar { padding: 0 10px; height: 48px; gap: 2px; }
  .app-logo { display: none; }
  .tab { padding: 5px 10px; font-size: 11.5px; gap: 4px; }
  .tab svg { display: block; }

  /* ── Calendar: stack vertically ── */
  .cal-layout { flex-direction: column; }
  .cal-main { padding: 12px 10px; overflow-y: auto; flex: none; }
  .cal-sidebar {
    width: 100%; border-left: none; border-top: 1px solid var(--border);
    padding: 12px 12px 20px; flex-shrink: 0; max-height: 52vh; overflow-y: auto;
  }
  .day-cell { min-height: 44px; padding: 3px 4px; }
  .event-dot { font-size: 8.5px; padding: 0 3px; }
  .day-num { font-size: 10px; }
  .cal-header { margin-bottom: 10px; }

  /* ── Timeline ── */
  .tl-layout { padding: 14px 12px; overflow: hidden; }
  .tl-header { margin-bottom: 14px; flex-direction: column; align-items: flex-start; gap: 8px; width: 100%; }
  .cat-filter-bar { flex-wrap: nowrap; overflow-x: scroll; overflow-y: visible; width: 100%; max-width: 100%; -webkit-overflow-scrolling: touch; touch-action: pan-x; scrollbar-width: none; padding-bottom: 4px; }
  .cat-filter-bar::-webkit-scrollbar { display: none; }
  .cat-filter-label { white-space: nowrap; flex-shrink: 0; }
  .cat-filter-btn { font-size: 11px; padding: 3px 9px; white-space: nowrap; flex-shrink: 0; min-width: max-content; }
  .tl-content { padding: 8px 10px; }
  .tl-title { font-size: 12.5px; }
  .tl-empty { text-align: center; width: 100%; padding: 0 20px; box-sizing: border-box; overflow: hidden; }
  .tl-empty p { white-space: normal; word-break: break-all; font-size: 11px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }

  /* ── Diary: stack vertically ── */
  .diary-layout { flex-direction: column; }
  .diary-list {
    width: 100%; border-right: none; border-bottom: 1px solid var(--border);
    flex-direction: row; gap: 6px; overflow-x: auto; overflow-y: hidden;
    padding: 8px 10px; flex-shrink: 0; max-height: 72px;
  }
  .diary-entry-row { min-width: 130px; flex-shrink: 0; padding: 5px 8px; }
  .diary-editor { padding: 14px 14px 20px; }
  .editor-header { flex-wrap: wrap; gap: 6px; }
  .diary-title-input { font-size: 14px; }

  /* ── Settings / Cat panels full-width ── */
  .settings-panel { width: 100%; max-width: 100vw; max-height: 90vh; border-radius: var(--radius) var(--radius) 0 0; margin-top: auto; }
  .cat-panel { width: 100%; max-width: 100vw; max-height: 90vh; border-radius: var(--radius) var(--radius) 0 0; margin-top: auto; }
  .settings-overlay.open { align-items: flex-end; }

  /* ── Toast position ── */
  .save-toast { bottom: 80px; right: 14px; }

  /* ── Cat select dropdown opens upward already; ensure not clipped ── */
  #cat-select-wrap { position: static; }
  #cat-dropdown { position: fixed; left: 10px; right: 10px; bottom: 60px; width: auto; }
}

/* Safe area insets for iPhone notch / home indicator */
@supports (padding-bottom: env(safe-area-inset-bottom)) {
  @media (max-width: 600px) {
    .cal-sidebar, .diary-editor, .tl-layout {
      padding-bottom: calc(14px + env(safe-area-inset-bottom));
    }
    .topbar {
      padding-top: env(safe-area-inset-top);
      height: calc(48px + env(safe-area-inset-top));
    }
  }
}

::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.22)}
</style>
</head>

<script>
// ═══════════════════════════════════════════════════
//  本地存储 (localStorage persistence)
// ═══════════════════════════════════════════════════
const STORAGE_KEY = 'shijian_v1';

let _appReady = false;

function saveAll() {
  if (!_appReady) return;
  try {
    const data = {
      events,
      entries,
      builtinCats: BUILTIN_CATS,
      customCats,
      theme: { bg: currentBg, accent: currentAccent },
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch(e) { /* quota exceeded or private mode */ }
}

function loadAll() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch(e) { return null; }
}

const DEFAULT_BUILTIN_CATS = [
  { id:'p1', name:'一级 — 最重大', color:'#c86450', builtin:true },
  { id:'p2', name:'二级 — 重要',   color:'#8c78d2', builtin:true },
  { id:'p3', name:'三级 — 一般',   color:'#50aa82', builtin:true },
  { id:'p4', name:'四级 — 次要',   color:'#be9632', builtin:true },
  { id:'p5', name:'五级 — 备注',   color:'#508cc8', builtin:true },
];

let BUILTIN_CATS = DEFAULT_BUILTIN_CATS.map(c => ({...c}));

let customCats = []; // user-created categories
function allCats() { return [...BUILTIN_CATS, ...customCats]; }
function catById(id) { return allCats().find(c=>c.id===id) || (allCats()[0]||{id:'',name:'未知',color:'#888'}); }

function hexToRgba(hex, a) {
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

function addCategory() {
  const name = document.getElementById('new-cat-name').value.trim();
  const color = document.getElementById('new-cat-color').value;
  if(!name) return;
  const id = 'c_' + Date.now();
  customCats.push({ id, name, color, builtin:false });
  document.getElementById('new-cat-name').value = '';
  renderCatList();
  refreshCatSelects();
  saveAll();
}

function deleteCategory(id) {
  BUILTIN_CATS = BUILTIN_CATS.filter(c=>c.id!==id);
  customCats = customCats.filter(c=>c.id!==id);
  // re-assign events of this category to first available cat or remove
  const first = allCats()[0];
  Object.values(events).forEach(evArr => {
    evArr.forEach(ev => { if(ev.catId===id) ev.catId = first ? first.id : ''; });
  });
  renderCatList();
  refreshCatSelects();
  renderCalendar();
  if(document.getElementById('pane-timeline').classList.contains('active')) renderTimeline();
  saveAll();
}

function updateCategoryName(id, newName) {
  if(!newName.trim()) return;
  const cat = allCats().find(c=>c.id===id);
  if(!cat) return;
  cat.name = newName.trim();
  // sync all rendered views
  refreshCatSelects();
  renderCalendar();
  if(document.getElementById('pane-timeline').classList.contains('active')) renderTimeline();
  saveAll();
}

function updateCategoryColor(id, newColor) {
  const cat = allCats().find(c=>c.id===id);
  if(!cat) return;
  cat.color = newColor;
  refreshCatSelects();
  renderCalendar();
  if(document.getElementById('pane-timeline').classList.contains('active')) renderTimeline();
  saveAll();
}

function renderCatList() {
  const el = document.getElementById('cat-list');
  const cats = allCats();
  const counts = {};
  Object.values(events).forEach(arr => arr.forEach(ev => {
    counts[ev.catId] = (counts[ev.catId]||0)+1;
  }));
  el.innerHTML = cats.map(c => `
    <div class="cat-row" id="catrow-${c.id}">
      <div class="color-picker-wrap" style="flex-shrink:0">
        <div class="cat-row-swatch" id="swatch-${c.id}" style="background:${c.color};width:18px;height:18px;border-radius:50%;cursor:pointer;border:1px solid rgba(255,255,255,0.18);flex-shrink:0;transition:transform 0.13s" title="点击修改颜色"></div>
        <input type="color" class="color-picker-native" value="${c.color}" style="position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;cursor:pointer;border-radius:50%"

      <button class="cat-row-del" data-del-id="${c.id}" title="删除类别">
        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>`).join('');

  // Attach delete listeners after render (avoids HTML-escaping issues in onclick)
  el.querySelectorAll('.cat-row-del[data-del-id]').forEach(btn => {

      const id = btn.getAttribute('data-del-id');

function confirmDeleteCat(id) {
  const cats = allCats();
  if(cats.length <= 1) {
    showCatConfirm('至少需要保留一个事件类别。', null);
    return;
  }
  const cat = cats.find(c=>c.id===id);
  if(!cat) return;
  const count = Object.values(events).reduce((s,arr)=>s+arr.filter(e=>e.catId===id).length,0);
  const msg = count > 0
    ? `删除「${cat.name}」？\n该类别下 ${count} 个事件将归入第一个类别。`
    : `删除「${cat.name}」？`;
  showCatConfirm(msg, () => deleteCategory(id));
}

function showCatConfirm(msg, onConfirm) {
  const overlay = document.getElementById('del-confirm-overlay');
  document.getElementById('del-confirm-msg').textContent = msg;
  overlay.style.display = 'flex';
  document.getElementById('del-confirm-ok').onclick = () => {
    overlay.style.display = 'none';
    if(onConfirm) onConfirm();
  };
  document.getElementById('del-confirm-cancel').onclick = () => {
    overlay.style.display = 'none';
  };
  // hide cancel if no action (info-only)
  document.getElementById('del-confirm-cancel').style.display = onConfirm ? '' : 'none';
  document.getElementById('del-confirm-ok').textContent = onConfirm ? '确认删除' : '好';
}

// ── Calendar ──
function renderCalendar(){
  const months=['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
  document.getElementById('cal-title').textContent=curYear+'年 '+months[curMonth];
  const grid=document.getElementById('cal-grid');
  grid.querySelectorAll('.day-cell').forEach(c=>c.remove());
  const first=new Date(curYear,curMonth,1).getDay();
  const daysInMonth=new Date(curYear,curMonth+1,0).getDate();
  const daysInPrev=new Date(curYear,curMonth,0).getDate();
  let dayCount=1,nextDay=1;
  for(let i=0;i<42;i++){
    const cell=document.createElement('div');cell.className='day-cell';
    let d,isOther=false;
    if(i<first){d=daysInPrev-(first-1-i);isOther=true;cell.classList.add('other-month');}
    else if(dayCount>daysInMonth){d=nextDay++;isOther=true;cell.classList.add('other-month');}
    else d=dayCount++;
    const cellDate=isOther?(i<first?new Date(curYear,curMonth-1,d):new Date(curYear,curMonth+1,d)):new Date(curYear,curMonth,d);
    if(!isOther&&cellDate.toDateString()===today.toDateString())cell.classList.add('today');
    if(cellDate.toDateString()===selectedDate.toDateString())cell.classList.add('selected');
    const num=document.createElement('div');num.className='day-num';num.textContent=d;cell.appendChild(num);
    const key=fmtKey(cellDate);
    if(events[key]){
      const hasP1=events[key].some(e=>e.catId==='p1');
      if(hasP1){const f=document.createElement('span');f.className='milestone-flag';f.textContent='🚩';cell.appendChild(f);}
      events[key].slice(0,2).forEach(ev=>{
        const cat=catById(ev.catId);
        const dot=document.createElement('div');
        dot.className='event-dot';
        dot.style.background=hexToRgba(cat.color,0.18);
        dot.style.border=`0.5px solid ${hexToRgba(cat.color,0.45)}`;
        dot.style.color=cat.color;
        // small color circle + title
        dot.innerHTML=`<span style="width:6px;height:6px;border-radius:50%;background:${cat.color};flex-shrink:0;display:inline-block"></span>${ev.title}`;
        cell.appendChild(dot);
      });
    }
    cell.onclick=()=>{selectedDate=cellDate;renderCalendar();renderSidebar();};
    grid.appendChild(cell);
  }
  renderSidebar();
}

function renderSidebar(){
  document.getElementById('sidebar-date').textContent=fmtDisplay(selectedDate);
  const key=fmtKey(selectedDate);
  const evs=events[key]||[];
  const c=document.getElementById('sidebar-events');
  if(!evs.length){c.innerHTML='<div class="empty-msg">暂无日程</div>';return;}
  c.innerHTML=evs.map((ev,i)=>{
    const cat=catById(ev.catId);
    const bg=hexToRgba(cat.color,0.15);
    const bd=hexToRgba(cat.color,0.48);
    return`<div class="event-item" style="background:${bg};border-left-color:${bd};color:${cat.color}">
      <button class="event-item-del" onclick="deleteEventSidebar('${key}',${i})" title="删除">
        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
      <div class="event-item-title">${ev.title}</div>
      <div class="event-item-time">${ev.time}</div>
      <div class="event-item-cat">
        <span style="width:7px;height:7px;border-radius:50%;background:${cat.color};display:inline-block"></span>
        ${cat.name}
      </div>
    </div>`;
  }).join('');
}

function deleteEventSidebar(key,idx){
  events[key].splice(idx,1);
  if(!events[key].length)delete events[key];
  renderCalendar();
  saveAll();
}

function prevMonth(){if(curMonth===0){curMonth=11;curYear--;}else curMonth--;renderCalendar();}
function nextMonth(){if(curMonth===11){curMonth=0;curYear++;}else curMonth++;renderCalendar();}

function addEvent(){
  const t=document.getElementById('ev-title').value.trim();
  const ti=document.getElementById('ev-time').value.trim()||'全天';
  const catId=document.getElementById('ev-cat-select').value;
  if(!t)return;
  const key=fmtKey(selectedDate);
  if(!events[key])events[key]=[];
  events[key].push({title:t,time:ti,catId});
  document.getElementById('ev-title').value='';
  document.getElementById('ev-time').value='';
  renderCalendar();
  saveAll();
}

// ── Timeline ──
function renderTimeline(){
  const body=document.getElementById('tl-body');
  const cats=activeCatFilter==='all'?allCats().map(c=>c.id):[activeCatFilter];
  let items=[];
  Object.entries(events).forEach(([key,evArr])=>{
    evArr.filter(e=>cats.includes(e.catId)).forEach(ev=>{
      const[y,m,d]=key.split('-').map(Number);
      items.push({date:new Date(y,m-1,d),key,ev});
    });
  });
  items.sort((a,b)=>a.date-b.date);
  if(!items.length){
    body.innerHTML=`<div class="tl-empty">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="9" y1="16" x2="15" y2="16"/></svg>
      <p>该类别暂无时间节点</p>
      <p style="font-size:10.5px;margin-top:2px;opacity:0.65">在日历中添加对应类别的事件后显示</p>
    </div>`;
    return;
  }
  const todayMs=new Date(today.getFullYear(),today.getMonth(),today.getDate()).getTime();
  const pastItems=items.filter(x=>x.date.getTime()<todayMs);
  const futureItems=items.filter(x=>x.date.getTime()>=todayMs);
  let html=`<div class="timeline"><div class="tl-line"></div>`;
  pastItems.forEach(x=>{
    const diff=Math.round((todayMs-x.date.getTime())/86400000);
    const diffStr=diff===0?'今天':diff+'天前';
    const cat=catById(x.ev.catId);
    html+=`<div class="tl-item past-node">
      <div class="tl-node" style="border-color:${cat.color};box-shadow:0 0 0 3px ${hexToRgba(cat.color,0.18)},0 0 8px ${hexToRgba(cat.color,0.15)}"></div>
      <div class="tl-content">
        <div class="tl-date">${fmtNice(x.key)} · ${diffStr}</div>
        <div class="tl-title">${x.ev.title}</div>
        <div class="tl-meta">
          <span style="width:7px;height:7px;border-radius:50%;background:${cat.color};display:inline-block;flex-shrink:0"></span>
          ${cat.name}${x.ev.time&&x.ev.time!=='全天'?' · '+x.ev.time:''}
        </div>
      </div>
    </div>`;
  });
  html+=`<div class="tl-today-marker">
    <div class="tl-today-line"></div>
    <div class="tl-today-node"></div>
    <div class="tl-today-label">今天 · ${today.getFullYear()}年${today.getMonth()+1}月${today.getDate()}日</div>
  </div>`;
  futureItems.forEach(x=>{
    const diff=Math.round((x.date.getTime()-todayMs)/86400000);
    const diffStr=diff===0?'今天':diff+'天后';
    const cat=catById(x.ev.catId);
    html+=`<div class="tl-item">
      <div class="tl-node" style="border-color:${cat.color};box-shadow:0 0 0 3px ${hexToRgba(cat.color,0.18)},0 0 8px ${hexToRgba(cat.color,0.15)}"></div>
      <div class="tl-content">
        <div class="tl-date">${fmtNice(x.key)} · ${diffStr}</div>
        <div class="tl-title">${x.ev.title}</div>
        <div class="tl-meta">
          <span style="width:7px;height:7px;border-radius:50%;background:${cat.color};display:inline-block;flex-shrink:0"></span>
          ${cat.name}${x.ev.time&&x.ev.time!=='全天'?' · '+x.ev.time:''}
        </div>
      </div>
    </div>`;
  });
  html+=`</div>`;
  body.innerHTML=html;
}

// ── Diary ──
let entries=[],activeIdx=-1,activeMood='',activeTags=[];
function todayStr2(){return fmtIso(today)}
function newEntry(){
  const e={id:Date.now(),date:todayStr2(),title:'',body:'',mood:'',tags:[]};
  entries.unshift(e);activeIdx=0;loadEntry(0);renderEntryList();
  saveAll();
}
function loadEntry(idx){
  activeIdx=idx;const e=entries[idx];
  document.getElementById('editor-date').textContent=fmtNice(e.date);
  document.getElementById('diary-title').value=e.title;
  document.getElementById('diary-body').value=e.body;
  activeMood=e.mood;activeTags=[...e.tags];
  document.querySelectorAll('.mood-btn').forEach(b=>{b.classList.remove('active');if(b.textContent===e.mood)b.classList.add('active');});
  renderTags();updateCount();
}
function saveEntry(){
  if(activeIdx<0)return;
  entries[activeIdx].title=document.getElementById('diary-title').value;
  entries[activeIdx].body=document.getElementById('diary-body').value;
  entries[activeIdx].mood=activeMood;entries[activeIdx].tags=[...activeTags];
  renderEntryList();
  saveAll();
  const t=document.getElementById('save-toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800);
}
function renderEntryList(){
  const q=(document.getElementById('diary-search').value||'').toLowerCase();
  const list=document.getElementById('entry-list');
  const f=entries.filter(e=>(e.title+e.body).toLowerCase().includes(q));
  if(!f.length){list.innerHTML='<div class="empty-msg">暂无日记</div>';return;}
  list.innerHTML=f.map(e=>{
    const i=entries.indexOf(e);
    return`<div class="diary-entry-row${i===activeIdx?' active':''}" onclick="loadEntry(${i});renderEntryList()">
      <div class="entry-date">${e.mood?e.mood+' ':''}${e.date}</div>
      <div class="entry-preview">${e.title||e.body||'空白日记'}</div>
    </div>`;
  }).join('');
}
function filterEntries(){renderEntryList();}
function setMood(btn,m){document.querySelectorAll('.mood-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');activeMood=m;}
function updateCount(){document.getElementById('char-count').textContent=document.getElementById('diary-body').value.length+' 字';}
function renderTags(){document.getElementById('tag-wrap').innerHTML=activeTags.map((t,i)=>`<span class="tag" onclick="removeTag(${i})">${t} ×</span>`).join('');}
function removeTag(i){activeTags.splice(i,1);renderTags();}
document.addEventListener('keydown',function(e){
  const inp=document.getElementById('tag-input');
  if(document.activeElement===inp&&e.key==='Enter'){const v=inp.value.trim();if(v&&!activeTags.includes(v)){activeTags.push(v);renderTags();}inp.value='';}
});


// ── 日记删除 ──
function deleteEntry(){
  if(activeIdx<0)return;
  const e=entries[activeIdx];
  const title=e.title||'空白日记';
  showDelConfirm(`确认删除日记「${title}」？\n此操作不可撤销。`,()=>{
    entries.splice(activeIdx,1);
    activeIdx=-1;
    document.getElementById('editor-date').textContent='';
    document.getElementById('diary-title').value='';
    document.getElementById('diary-body').value='';
    activeMood='';activeTags=[];
    renderTags();updateCount();
    renderEntryList();
    saveAll();
  });
}

// ── 日记导出 ──
function exportDiary(){
  if(!entries.length){alert('暂无日记可导出');return;}
  const data=JSON.stringify({version:'1.0',type:'diary',data:entries},null,2);
  const blob=new Blob([data],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='时笺日记_'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
}

// ── 日记导入 ──
function importDiary(event){
  const file=event.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const json=JSON.parse(e.target.result);
      if(json.type!=='diary'||!Array.isArray(json.data))throw new Error('格式错误');
      const count=json.data.length;
      showDelConfirm(`导入 ${count} 条日记？\n将与现有日记合并（按 ID 去重）。`,()=>{
        const existIds=new Set(entries.map(x=>x.id));
        let added=0;
        json.data.forEach(item=>{
          if(!existIds.has(item.id)){entries.push(item);added++;}
        });
        entries.sort((a,b)=>b.id-a.id);
        renderEntryList();
        saveAll();
        alert(`导入完成，新增 ${added} 条日记`);
      });
    }catch(err){alert('导入失败：文件格式不正确');}
    event.target.value='';
  };
  reader.readAsText(file);
}

// ── 日历导出 ──
function exportCalendar(){
  if(!events.length){alert('暂无日历事件可导出');return;}
  const data=JSON.stringify({version:'1.0',type:'calendar',categories:categories,events:events},null,2);
  const blob=new Blob([data],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='时笺日历_'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
}

// ── 日历导入 ──
function importCalendar(event){
  const file=event.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const json=JSON.parse(e.target.result);
      if(json.type!=='calendar'||!Array.isArray(json.events))throw new Error('格式错误');
      const count=json.events.length;
      showDelConfirm(`导入 ${count} 个日历事件？\n将与现有事件合并（按 ID 去重）。`,()=>{
        // 合并类别
        if(Array.isArray(json.categories)){
          const existCatIds=new Set(categories.map(c=>c.id));
          json.categories.forEach(c=>{if(!existCatIds.has(c.id))categories.push(c);});
        }
        // 合并事件
        const existEvIds=new Set(events.map(x=>x.id));
        let added=0;
        json.events.forEach(ev=>{
          if(!existEvIds.has(ev.id)){events.push(ev);added++;}
        });
        refreshCatSelects();
        renderCalendar();
        renderTimeline();
        saveAll();
        alert(`导入完成，新增 ${added} 个事件`);
      });
    }catch(err){alert('导入失败：文件格式不正确');}
    event.target.value='';
  };
  reader.readAsText(file);
}

// ── Init ──
seedEvents();
buildSettingsUI();

(function initFromStorage() {
  const saved = loadAll();
  if (saved) {
    if (saved.events)      events      = saved.events;
    if (saved.entries)     entries     = saved.entries;
    if (saved.builtinCats) BUILTIN_CATS = saved.builtinCats;
    if (saved.customCats)  customCats  = saved.customCats;
    if (saved.theme) {
      const bgPreset = BG_PRESETS.find(p => p.id === saved.theme.bg);
      applyBg(bgPreset || BG_PRESETS[0], false);
      const acPreset = ACCENT_PRESETS.find(a => a.id === saved.theme.accent);
      applyAccent(acPreset || ACCENT_PRESETS[0]);
    } else {
      applyBg(BG_PRESETS[0], false);
      applyAccent(ACCENT_PRESETS[0]);
    }
  } else {
    applyBg(BG_PRESETS[0], false);
    applyAccent(ACCENT_PRESETS[0]);
  }
})();

refreshCatSelects();
renderCalendar();
_appReady = true;
